<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="site-header__mark" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav">
      <a href="{{ '/services/' | relative_url }}"{% if page.url contains '/services' %} aria-current="page"{% endif %}>Services</a>
      <a href="https://github.com/{{ site.author }}" rel="me noopener">GitHub</a>
    </nav>
  </div>
</header>
