      }

      function toggleOutput(path) {
        state.outputCollapsed.has(path) ? state.outputCollapsed.delete(path) : state.outputCollapsed.add(path);
      }

      function copyOutput() {
        const file = findOutputFile(state.selectedOutputPath);
        if (!file) return;
        copyText(file.content).then(() => toast("File content copied.", "success")).catch(() => toast("Copy is unavailable here.", "error"));
      }

      function downloadOutput() {
        const file = findOutputFile(state.selectedOutputPath);
        if (file) downloadBlob(file.name, file.content, "text/plain;charset=utf-8");
      }

      function downloadBlob(filename, content, type = "application/json") {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = filename;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function saveConfiguration() {
        if (!state.config) return;
        const payload = JSON.stringify(state.config, null, 2) + "\n";
        downloadBlob(`${slugifyFileName(state.config.name)}.template.json`, payload);
        state.dirty = false;
        scheduleLocalSave();
        toast("Configuration saved.", "success");
      }

      function bytesToBase64Url(bytes) {
        let binary = "";
        for (let index = 0; index < bytes.length; index += 0x8000) {
          binary += String.fromCharCode(...bytes.subarray(index, index + 0x8000));
        }
        return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
      }

      function base64UrlToBytes(value) {
        const normalized = String(value).replace(/-/g, "+").replace(/_/g, "/");
        const binary = atob(normalized + "=".repeat((4 - normalized.length % 4) % 4));
        return Uint8Array.from(binary, character => character.charCodeAt(0));
      }

      async function encodeShareCode(payload) {
        const bytes = new TextEncoder().encode(JSON.stringify(payload));
        if (globalThis.CompressionStream) {
          try {
            const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));
            const compressed = new Uint8Array(await new Response(stream).arrayBuffer());
            return `g.${bytesToBase64Url(compressed)}`;
          } catch {}
        }
        return `j.${bytesToBase64Url(bytes)}`;
      }

      function extractShareCode(value) {
        let candidate = String(value || "").trim();
        if (!candidate) throw new Error("Paste a share link or code.");
        const hashIndex = candidate.indexOf("#");
        if (hashIndex >= 0) candidate = candidate.slice(hashIndex + 1);
        candidate = candidate.replace(/^#/, "");
        if (candidate.includes("template=") || candidate.includes("view=")) {
          const params = new URLSearchParams(candidate);
          candidate = params.get("view") || params.get("template") || "";
        }
        if (!/^[gj]\.[A-Za-z0-9_-]+$/.test(candidate)) throw new Error("This is not a valid Boilerplater share code.");
        return candidate;
      }

      async function decodeShareCode(value) {
        const code = extractShareCode(value);
        const [format, payload] = code.split(".", 2);
        let bytes = base64UrlToBytes(payload);
        if (format === "g") {
          if (!globalThis.DecompressionStream) throw new Error("This browser cannot open compressed template links.");
          const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
          bytes = new Uint8Array(await new Response(stream).arrayBuffer());
        }
        const parsed = JSON.parse(new TextDecoder().decode(bytes));
        if (parsed?.view === "viewer" && parsed.configuration) {
          return { code, config: validateAndNormalizeConfig(parsed.configuration), values: normalizeValuesPayload(parsed.values), mode: "viewer", hashKey: "view" };
        }
        return { code, config: validateAndNormalizeConfig(parsed), values: null, mode: "fill", hashKey: "template" };
      }

      async function copyText(value) {
        try {
          await navigator.clipboard.writeText(value);
        } catch {
          const field = document.createElement("textarea");
          field.value = value;
          field.style.position = "fixed";
          field.style.opacity = "0";
          document.body.appendChild(field);
          field.select();
          const copied = document.execCommand?.("copy");
          field.remove();
          if (!copied) throw new Error("Copy is unavailable here.");
        }
      }

      async function openEncodedShareDialog(payload, hashKey, title, completed = false) {
        try {
          state.shareCode = await encodeShareCode(payload);
          state.shareHashKey = hashKey;
          const url = new URL(location.href);
          url.hash = hashKey + "=" + state.shareCode;
          const localFile = location.protocol === "file:";
          Object.assign(ui.share, {
            action: "copy-link",
            title,
            description: (completed ? "The completed result" : "The configuration") + (state.shareCode.startsWith("g.") ? " is compressed into the URL fragment." : " is encoded in the URL fragment."),
            label: "Share link",
            value: url.toString(),
            note: localFile
              ? "A full file link only works on this device. Copy the code when sharing with someone who has their own copy of this HTML."
              : "Opening this link loads " + (completed ? "the locked completed result" : "the template") + " automatically. Link length: " + url.toString().length.toLocaleString() + " characters.",
            readOnly: true,
            secondary: localFile
          });
          showDialog("shareDialog", "textarea");
        } catch (error) {
          toast(error.message || "Could not create a share link.", "error");
        }
      }

      function openShareDialog() {
        if (state.config) return openEncodedShareDialog(state.config, "template", "Share template");
      }

      function openViewerShareDialog() {
        if (!state.config || state.mode !== "fill") return;
        if (outputErrors().length) return toast("Resolve the form errors before sharing a locked result.", "error");
        return openEncodedShareDialog(
          { shareVersion: 1, view: "viewer", configuration: state.config, values: snapshotFormValues() },
          "view",
          "Share completed result",
          true
        );
      }

      function openShareCodeDialog() {
        state.shareCode = "";
        state.shareHashKey = "template";
        Object.assign(ui.share, {
          action: "open-code",
          title: "Open shared template",
          description: "Paste either a full link or the code beginning with g. or j.",
          label: "Share link or code",
          value: "",
          note: "Template links open in Preview mode. Completed-result links open in locked Viewer mode.",
          readOnly: false,
          secondary: false
        });
        showDialog("shareDialog", "textarea");
      }

      async function handleShareSubmit(action = ui.share.action) {
        try {
          if (action === "copy-link") {
            await copyText(ui.share.value);
            toast("Share link copied.", "success");
          } else if (action === "copy-code") {
            await copyText("#" + state.shareHashKey + "=" + state.shareCode);
            toast("Share code copied.", "success");
          } else if (action === "open-code") {
            const decoded = await decodeShareCode(ui.share.value);
            state.shareHashKey = decoded.hashKey;
            try {
              history.replaceState(null, "", location.pathname + location.search + "#" + decoded.hashKey + "=" + decoded.code);
            } catch {
              try { location.hash = decoded.hashKey + "=" + decoded.code; } catch {}
            }
            loadConfiguration(decoded.config, decoded.mode, decoded.values);
            toast(decoded.mode === "viewer" ? "Completed result opened." : "Shared template opened.", "success");
          }
          closeDialog("shareDialog");
        } catch (error) {
          toast(error.message || "Could not use this share code.", "error");
        }
      }

      async function readConfigurationFile(file, input = null) {
        if (!file) return;
        try {
          const parsed = JSON.parse(await file.text());
          loadConfiguration(parsed, "fill");
          toast("Opened " + file.name + ".", "success");
        } catch (error) {
          toast(error.message || "Could not open this configuration.", "error");
        } finally {
          if (input) input.value = "";
        }
      }

      function setTheme(theme) {
        ui.theme = theme;
        document.documentElement.dataset.theme = theme;
        try { localStorage.setItem(THEME_KEY, theme); } catch {}
      }

      function initializeTheme() {
        let theme = "light";
        try {
          theme = localStorage.getItem(THEME_KEY) || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        } catch {}
        setTheme(theme);
      }

      function toast(message, type = "success") {
        const item = { id: uid(), message: String(message || ""), type };
        ui.toasts.push(item);
        setTimeout(() => {
          const index = ui.toasts.findIndex(entry => entry.id === item.id);
          if (index >= 0) ui.toasts.splice(index, 1);
        }, 3600);
      }

      function openConfirmation(action, title, description, label, danger = false) {
        Object.assign(ui.confirm, { action, title, description, label, danger });
        showDialog("confirmDialog", "button.primary");
      }

      function confirmAction() {
        const action = ui.confirm.action;
        ui.confirm.action = "";
        closeDialog("confirmDialog");
        if (action === "delete-node") removeSelectedNode();
        else if (action === "new-config") loadConfiguration(blankConfig(), "configure");
        else if (action === "open-config") document.getElementById("configFileInput")?.click();
      }

      function cancelConfirmation() {
        state.pendingDeleteId = null;
        ui.confirm.action = "";
        closeDialog("confirmDialog");
      }

      function requestNewConfiguration() {
        if (!state.config || !state.dirty) return loadConfiguration(blankConfig(), "configure");
        openConfirmation("new-config", "Start a new template?", "Save the current configuration first if you want a portable copy.", "Start new");
      }

      function requestOpenConfiguration() {
        if (!state.config || !state.dirty) return document.getElementById("configFileInput")?.click();
        openConfirmation("open-config", "Open another configuration?", "Your current configuration has changes that have not been downloaded.", "Open file");
      }

      function variableTypeState() {
        const field = ui.variable.originalKey ? findAnalyzedField(ui.variable.originalKey) : null;
        return typeSettingFeedback(field, ui.variable.type);
      }

      function openVariableDialog(reference = null) {
        const isNew = !reference;
        const field = reference ? findAnalyzedField(reference) : null;
        const definition = reference ? (state.config.variables?.[reference] || {}) : { manual: true };
        const requestedType = definition.type || "auto";
        const setting = typeSettingFeedback(field, requestedType).setting;
        Object.assign(ui.variable, {
          isNew,
          originalKey: reference || "",
          name: reference || "",
          label: definition.label || "",
          type: requestedType,
          default: Object.prototype.hasOwnProperty.call(definition, "default") ? definition.default : setting.type === "boolean" ? false : "",
          docs: definition.docs || "",
          description: definition.description || "",
          required: Boolean(definition.required),
          pattern: definition.pattern || "",
          patternMessage: definition.patternMessage || "",
          derive: definition.derive || "",
          advanced: Boolean(definition.description || definition.required || definition.pattern || definition.patternMessage || definition.derive)
        });
        showDialog("variableDialog");
      }

      function saveVariableDefinition() {
        const draft = ui.variable;
        const previousKey = draft.originalKey;
        const key = draft.name.trim();
        if (!/^[A-Za-z_][\w.-]*$/.test(key)) return toast("Use letters, numbers, dots, dashes, or underscores for the variable name.", "error"), false;
        const existingField = previousKey ? findAnalyzedField(previousKey) : null;
        const existingDefinition = previousKey ? (state.config.variables?.[previousKey] || {}) : {};
        const isManual = draft.isNew || Boolean(existingDefinition.manual || existingField?.manual);
        if (key !== previousKey && (state.analysis.globals.has(key) || state.analysis.collections.has(key) || findAnalyzedField(key) || Object.prototype.hasOwnProperty.call(state.config.variables || {}, key))) {
          return toast("A variable named " + key + " already exists.", "error"), false;
        }
        const typeSetting = resolveTypeSetting(existingField?.inferredType || "text", draft.type, existingField?.inferredOptions || []);
        const pattern = draft.pattern;
        if (pattern) {
          try { new RegExp(pattern); }
          catch { return toast("The validation pattern is not a valid regular expression.", "error"), false; }
        }
        const definition = {};
        if (isManual) definition.manual = true;
        if (draft.type !== "auto") definition.type = draft.type;
        if (draft.label.trim()) definition.label = draft.label.trim();
        if (draft.description.trim()) definition.description = draft.description.trim();
        if (draft.docs.trim()) definition.docs = draft.docs;
        if (draft.required) definition.required = true;
        if (pattern) definition.pattern = pattern;
        if (draft.patternMessage.trim()) definition.patternMessage = draft.patternMessage.trim();
        if (draft.derive.trim()) definition.derive = draft.derive.trim();
        const effectiveType = typeSetting.type;
        const options = typeSetting.options || [];
        if (effectiveType === "choice" && draft.default !== "" && !options.includes(String(draft.default))) {
          return toast("The default must match one of the choices.", "error"), false;
        }
        if (!definition.derive && effectiveType === "boolean") definition.default = String(draft.default) === "true" || draft.default === true;
        else if (!definition.derive && draft.default !== "") definition.default = String(draft.default);

        state.config.variables ||= {};
        if (previousKey && previousKey !== key) {
          delete state.config.variables[previousKey];
          if (Object.prototype.hasOwnProperty.call(state.values.globals, previousKey)) {
            state.values.globals[key] = state.values.globals[previousKey];
            delete state.values.globals[previousKey];
          }
        }
        state.config.variables[key] = definition;
        recompute();
        setDirty();
        closeDialog("variableDialog");
        toast(draft.isNew ? "Variable added." : "Variable settings saved.", "success");
        return true;
      }

      function removeVariableDefinition() {
        const key = ui.variable.originalKey;
        if (!key || !state.config.variables?.[key]) return;
        const wasManual = Boolean(state.config.variables[key].manual);
        delete state.config.variables[key];
        if (wasManual) delete state.values.globals[key];
        recompute();
        setDirty();
        closeDialog("variableDialog");
        toast(wasManual ? "Variable removed." : "Variable settings reset.", "success");
      }

      // Declarative Vue presentation layer
      const FileIcon = {
        props: { name: { type: String, default: "" } },
        setup(props) {
          return { markup: computed(() => renderFileIcon(props.name)) };
        },
        template: `<span class="file-icon-host" v-html="markup"></span>`
      };

      const DiagnosticItem = {
        props: { item: { type: Object, required: true } },
        template: `<div class="diagnostic" :class="item.level || 'warning'"><strong>{{ item.title }}</strong>{{ item.message }}</div>`
      };

      const ConfigTreeNode = {
        name: "ConfigTreeNode",
        props: {
          node: { type: Object, required: true },
          depth: { type: Number, default: 0 }
        },
        setup(props) {
          const isFolder = computed(() => props.node.type === "folder");
          const computeNode = computed(() => isFolder.value ? parseCompute(props.node.name) : null);
          const collapsed = computed(() => state.collapsed.has(props.node.id));
          const selected = computed(() => state.selectedNodeId === props.node.id);
          const choose = () => selectNode(props.node.id);
          const toggle = () => toggleNode(props.node.id);
          const onKey = event => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              choose();
            }
          };
          return { state, icons, isFolder, computeNode, collapsed, selected, choose, toggle, onKey };
        },
        template: `
          <div class="tree-node" role="none">
            <div class="tree-row" :class="{ selected }" tabindex="0" role="treeitem"
              :aria-level="depth + 1" :aria-selected="selected"
              :aria-expanded="isFolder ? String(!collapsed) : undefined"
              :style="{ '--depth': depth }" @click="choose" @keydown="onKey">
              <span class="tree-indent"></span>
              <button v-if="isFolder" class="tree-toggle" :class="{ open: !collapsed }" type="button"
                :aria-label="(collapsed ? 'Expand ' : 'Collapse ') + node.name" @click.stop="toggle" v-html="icons.chevron"></button>
              <span v-else class="tree-toggle"></span>
              <span class="tree-icon" :class="{ compute: computeNode }">
                <span v-if="computeNode" v-html="icons.compute"></span>
                <span v-else-if="isFolder" v-html="collapsed ? icons.folder : icons.folderOpen"></span>
                <file-icon v-else :name="node.name"></file-icon>
              </span>
              <span class="tree-name" :title="node.name">{{ node.name || "(empty)" }}</span>
              <span v-if="computeNode" class="tree-badge">{{ computeNode.type }}</span>
            </div>
            <div v-if="isFolder && !collapsed" role="group">
              <config-tree-node v-for="child in node.children" :key="child.id" :node="child" :depth="depth + 1"></config-tree-node>
            </div>
          </div>`
      };

      const OutputTreeNode = {
        name: "OutputTreeNode",
        props: {
          node: { type: Object, required: true },
          depth: { type: Number, default: 0 }
        },
        setup(props) {
          const isFolder = computed(() => props.node.type === "folder");
          const collapsed = computed(() => state.outputCollapsed.has(props.node.path));
          const selected = computed(() => state.selectedOutputPath === props.node.path);
          const choose = () => selectOutput(props.node.path);
          const toggle = () => toggleOutput(props.node.path);
          const onKey = event => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              choose();
            }
          };
          return { icons, isFolder, collapsed, selected, choose, toggle, onKey };
        },
        template: `
          <div class="tree-node" role="none">
            <div class="tree-row" :class="{ 'output-selected': selected }" tabindex="0" role="treeitem"
              :aria-level="depth + 1" :aria-selected="selected"
              :aria-expanded="isFolder ? String(!collapsed) : undefined"
              :style="{ '--depth': depth }" @click="choose" @keydown="onKey">
              <span class="tree-indent"></span>
              <button v-if="isFolder" class="tree-toggle" :class="{ open: !collapsed }" type="button"
                :aria-label="(collapsed ? 'Expand ' : 'Collapse ') + node.name" @click.stop="toggle" v-html="icons.chevron"></button>
              <span v-else class="tree-toggle"></span>
              <span class="tree-icon">
                <span v-if="isFolder" v-html="collapsed ? icons.folder : icons.folderOpen"></span>
                <file-icon v-else :name="node.name"></file-icon>
              </span>
              <span class="tree-name" :title="node.name">{{ node.name }}</span>
            </div>
            <div v-if="isFolder && !collapsed" role="group">
              <output-tree-node v-for="child in node.children" :key="child.path" :node="child" :depth="depth + 1"></output-tree-node>
            </div>
          </div>`
      };

      const FieldControl = {
        props: {
          field: { type: Object, required: true },
          collection: { type: String, default: "" },
          index: { type: Number, default: -1 },
          readOnly: { type: Boolean, default: false }
        },
        setup(props) {
          const value = computed(() => props.collection
            ? state.values.collections[props.collection]?.[props.index]?.[props.field.key]
            : state.values.globals[props.field.key]);
          const inputId = computed(() => "field-" + (props.collection ? props.collection + "-" + props.index + "-" : "global-") + props.field.key.replace(/[^a-zA-Z0-9_-]/g, "-"));
          const supportId = computed(() => inputId.value + "-support");
          const error = computed(() => validateFieldValue(props.field, value.value));
          const locked = computed(() => Boolean(props.field.derive) || props.readOnly);

                    <template v-if="state.rendered.tree.length">
                      <div v-if="errors.length" class="output-issues"><diagnostic-item v-for="(item, index) in errors.slice(0, 3)" :key="index" :item="item"></diagnostic-item></div>
                      <div class="tree-wrap" role="tree" aria-label="Generated files"><output-tree-node v-for="node in state.rendered.tree" :key="node.path" :node="node"></output-tree-node></div>
                    </template>
                    <div v-else class="empty-state">
                      <div class="empty-state-inner">
                        <div class="empty-state-icon" v-html="errors.length ? icons.alert : icons.folder"></div>
                        <strong>{{ emptyOutput.title }}</strong><p>{{ emptyOutput.text }}</p>
                        <div v-if="errors.length" class="diagnostic-list"><diagnostic-item v-for="(item, index) in errors.slice(0, 3)" :key="index" :item="item"></diagnostic-item></div>
                      </div>
                    </div>
                  </div>
                </section>

                <section class="pane" aria-label="Rendered file content">
                  <div class="pane-header">
                    <div class="pane-heading"><div class="pane-title">{{ selectedFile ? selectedFile.name : "File preview" }}</div><div class="pane-subtitle">{{ selectedFile ? selectedFile.path : "Select a generated file" }}</div></div>
                    <div v-if="selectedFile" class="pane-actions">
                      <button class="button ghost small" type="button" @click="copyOutput"><span v-html="icons.copy"></span><span class="button-label">Copy</span></button>
                      <button class="button small" type="button" @click="downloadOutput"><span v-html="icons.download"></span><span class="button-label">Download file</span></button>
                    </div>
                  </div>
                  <div class="pane-body">
                    <div v-if="selectedFile" v-html="renderCodePreview(selectedFile.content, selectedFile.name)"></div>
                    <div v-else class="empty-state"><div class="empty-state-inner"><div class="empty-state-icon" v-html="icons.file"></div><strong>No file selected</strong><p>Choose a file from the generated tree to inspect its content.</p></div></div>
                  </div>
                  <div class="pane-footer"><span>{{ selectedFile ? selectedFile.content.split("\\n").length + " lines · " + selectedFile.content.length + " characters" : "" }}</span><span>{{ selectedFile ? fileLanguage(selectedFile.name) : "" }}</span></div>
                </section>
              </template>
            </section>
          </main>

          <input class="sr-only" id="configFileInput" type="file" accept=".json,.template.json,application/json" @change="onFileChange">

          <dialog id="createDialog" :aria-labelledby="'createDialogTitle'" @cancel="closeCreate">
            <form method="dialog" @submit.prevent="createItemFromDialog">
              <div class="dialog-header"><h2 id="createDialogTitle">{{ createTitle }}</h2><p>Inside {{ ui.create.parentLabel }}</p></div>
              <div class="dialog-body">
                <template v-if="ui.create.kind === 'compute'">
                  <div class="field"><label for="computeType">Behavior</label><select class="select" id="computeType" v-model="ui.create.computeType">
                    <option value="group">Group without an output folder</option><option value="for">Repeat for a collection</option><option value="when">Include when checked</option><option value="when-not">Include when unchecked</option>
                  </select></div>
                  <template v-if="ui.create.computeType === 'for'">
                    <div class="field"><label for="computeCollection">Collection name</label><input class="input" id="computeCollection" v-model="ui.create.collection" required spellcheck="false"></div>
                    <div class="field"><label for="computeBinding">Loop binding</label><input class="input" id="computeBinding" v-model="ui.create.binding" required spellcheck="false"><div class="dialog-note">Use item for one direct value, or (name, variant) to expose multiple values.</div></div>
                  </template>
                  <div v-else-if="ui.create.computeType === 'when' || ui.create.computeType === 'when-not'" class="field">
                    <label for="computeReference">Condition</label><input class="input" id="computeReference" v-model="ui.create.reference" required spellcheck="false"><div class="dialog-note">Use enabled for a checkbox, or mode=advanced for an inferred choice.</div>
                  </div>
                  <div v-else class="field"><label for="computeLabel">Group label</label><input class="input" id="computeLabel" v-model="ui.create.label" required spellcheck="false"></div>
                </template>
                <template v-else>
                  <div class="field"><label for="createName">{{ ui.create.kind === "file" ? "File name" : "Folder name" }}</label><input class="input" id="createName" v-model="ui.create.name" autocomplete="off" spellcheck="false" required></div>
                  <div v-if="ui.create.kind === 'file'" class="field"><label for="createContent">Initial content <span class="optional-label">Optional</span></label><textarea class="textarea-small" id="createContent" v-model="ui.create.content" @keydown.ctrl.enter.prevent="createItemFromDialog" @keydown.meta.enter.prevent="createItemFromDialog"></textarea></div>
                </template>
              </div>
              <div class="dialog-footer"><button class="button" type="button" @click="closeCreate">Cancel</button><button class="button primary" type="submit">Create</button></div>
            </form>
          </dialog>

          <dialog id="confirmDialog" aria-labelledby="confirmDialogTitle" @cancel.prevent="cancelConfirmation">
            <form method="dialog" @submit.prevent="confirmAction">
              <div class="dialog-header"><h2 id="confirmDialogTitle">{{ ui.confirm.title }}</h2><p>{{ ui.confirm.description }}</p></div>
              <div class="dialog-footer"><button class="button" type="button" @click="cancelConfirmation">Cancel</button><button class="button primary" :class="{ danger: ui.confirm.danger }" type="submit">{{ ui.confirm.label }}</button></div>
            </form>
          </dialog>

          <dialog class="wide-dialog" id="variableDialog" aria-labelledby="variableDialogTitle" @cancel="closeVariable">
            <form method="dialog" @submit.prevent="saveVariableDefinition">
              <div class="dialog-header"><h2 id="variableDialogTitle">{{ ui.variable.isNew ? "Add variable" : "Variable settings" }}</h2><p>{{ variableDescription }}</p></div>
              <div class="dialog-body scrollable">
                <div class="field"><label for="variableName">Variable name</label><input class="input" id="variableName" v-model="ui.variable.name" required pattern="[A-Za-z_][A-Za-z0-9_.-]*" spellcheck="false" :readonly="variableNameLocked"></div>
                <div class="variable-basic-grid">
                  <label class="variable-label-label" for="variableLabel">Form label <span class="optional-label">Optional</span></label>
                  <label class="variable-type-label" for="variableType">Input type</label>
                  <input class="input variable-label-control" id="variableLabel" v-model="ui.variable.label" :placeholder="variableLabelPlaceholder">
                  <select class="select variable-type-control" :class="{ invalid: variableState.setting.invalid }" id="variableType" v-model="ui.variable.type" :aria-invalid="variableState.setting.invalid">
                    <option value="auto">Auto (recommended)</option><option value="boolean">Boolean</option><option value="choice">Choice</option><option value="text">Text</option>
                  </select>
                  <div v-if="variableState.message" class="variable-type-status field-error">{{ variableState.message }}</div>
                </div>
                <div v-if="variableState.setting.type === 'boolean'" class="field"><label for="variableDefault">Initial state</label><select class="select" id="variableDefault" v-model="ui.variable.default"><option :value="false">Unchecked</option><option :value="true">Checked</option></select></div>
                <template v-else-if="variableState.setting.type === 'choice'">
                  <div class="field"><label>Detected choices</label><div class="dialog-note"><span v-for="option in variableState.setting.options || []" :key="option" class="badge">{{ option }}</span></div></div>
                  <div class="field"><label for="variableDefault">Initial choice</label><select class="select" id="variableDefault" v-model="ui.variable.default"><option value="">First detected choice</option><option v-for="option in variableState.setting.options || []" :key="option" :value="option">{{ option }}</option></select></div>
                </template>
                <div v-else class="field"><label for="variableDefault">Default value <span class="optional-label">Optional</span></label><input class="input" id="variableDefault" v-model="ui.variable.default" type="text"></div>
                <div class="field variable-docs-setting"><label for="variableDocs">Form documentation <span class="optional-label">Markdown</span></label><textarea class="textarea-small" id="variableDocs" v-model="ui.variable.docs" @keydown.ctrl.enter.prevent="saveVariableDefinition" @keydown.meta.enter.prevent="saveVariableDefinition"></textarea><div class="dialog-note">Shown beneath the generated form.</div></div>
                <details class="advanced-disclosure" :open="ui.variable.advanced" @toggle="ui.variable.advanced = $event.target.open">
                  <summary>Validation and automation</summary>
                  <div class="advanced-body">
                    <div class="field"><label for="variableDescription">Description <span class="optional-label">Optional</span></label><input class="input" id="variableDescription" v-model="ui.variable.description"></div>
                    <div class="field"><div class="checkbox-row"><input id="variableRequired" v-model="ui.variable.required" type="checkbox"><label for="variableRequired">Required</label></div></div>
                    <div class="field"><label for="variablePattern">Validation pattern <span class="optional-label">Regular expression</span></label><input class="input" id="variablePattern" v-model="ui.variable.pattern"></div>
                    <div class="field"><label for="variablePatternMessage">Validation message <span class="optional-label">Optional</span></label><input class="input" id="variablePatternMessage" v-model="ui.variable.patternMessage"></div>
                    <div class="field"><label for="variableDerive">Derived value template <span class="optional-label">Optional</span></label><textarea class="textarea-small" id="variableDerive" v-model="ui.variable.derive" :placeholder="'{{first}}-{{second}}'" @keydown.ctrl.enter.prevent="saveVariableDefinition" @keydown.meta.enter.prevent="saveVariableDefinition"></textarea><div class="dialog-note">When set, this field updates from other variables and cannot be edited.</div></div>
                  </div>
                </details>
              </div>
              <div class="dialog-footer">
                <button v-if="variableCanRemove" class="button danger" type="button" @click="removeVariableDefinition">{{ state.config.variables[ui.variable.originalKey]?.manual ? "Remove variable" : "Reset settings" }}</button>
                <span class="dialog-spacer"></span>
                <button class="button" type="button" @click="closeVariable">Cancel</button>
                <button class="button primary" type="submit">Save variable</button>
              </div>
            </form>
          </dialog>

          <dialog class="wide-dialog" id="shareDialog" aria-labelledby="shareDialogTitle" @cancel="closeShare">
            <form method="dialog" @submit.prevent="handleShareSubmit()">
              <div class="dialog-header"><h2 id="shareDialogTitle">{{ ui.share.title }}</h2><p>{{ ui.share.description }}</p></div>
              <div class="dialog-body">
                <div class="field"><label for="shareValue">{{ ui.share.label }}</label><textarea class="textarea-small share-value" id="shareValue" v-model="ui.share.value" :readonly="ui.share.readOnly" spellcheck="false" @keydown.enter.exact.prevent="handleShareSubmit()"></textarea></div>
                <div class="dialog-note">{{ ui.share.note }}</div>
              </div>
              <div class="dialog-footer">
                <button class="button" type="button" @click="closeShare">Cancel</button>
                <button v-if="ui.share.secondary" class="button" type="button" @click="handleShareSubmit('copy-code')">Copy code</button>
                <button class="button primary" type="submit">{{ sharePrimaryLabel }}</button>
              </div>
            </form>
          </dialog>

          <div class="toast-region" aria-live="polite" aria-atomic="true">
            <div v-for="item in ui.toasts" :key="item.id" class="toast" :class="item.type"><span v-html="item.type === 'error' ? icons.alert : icons.check"></span><span>{{ item.message }}</span></div>
          </div>
        `
      };

      const app = createApp(StudioApp);
      app.component("file-icon", FileIcon);
      app.component("diagnostic-item", DiagnosticItem);
      app.component("config-tree-node", ConfigTreeNode);
      app.component("output-tree-node", OutputTreeNode);
      app.component("field-control", FieldControl);
      app.component("generated-form", GeneratedForm);
      app.component("template-guide", TemplateGuide);
      app.component("variable-docs", VariableDocs);
      app.component("syntax-help", SyntaxHelp);
      app.mount("#app");

      window.addEventListener("keydown", event => {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
          event.preventDefault();
          if (state.config && state.mode !== "viewer") saveConfiguration();
        }
      });
      window.addEventListener("beforeunload", event => {
        if (!state.dirty) return;
        event.preventDefault();
        event.returnValue = "";
      });

      async function initializeApp() {
        initializeTheme();
        updateResume();
        if (!location.hash.includes("template=") && !location.hash.includes("view=")) return;
        try {
          const decoded = await decodeShareCode(location.hash);
          loadConfiguration(decoded.config, decoded.mode, decoded.values);
          toast(decoded.mode === "viewer" ? "Completed result opened." : "Shared template opened.", "success");
        } catch (error) {
          toast(error.message || "Could not open the shared template.", "error");
        }
      }

      initializeApp();

      window.Boilerplater = {
        load: config => loadConfiguration(config, "fill"),
        createBlank: () => loadConfiguration(blankConfig(), "configure"),
        getConfiguration: () => deepClone(state.config),
        getRenderedFiles: () => flattenOutputFiles(state.rendered?.tree || []).map(file => ({ path: file.path, content: file.content })),
        createShareCode: () => encodeShareCode(state.config),
        createViewerShareCode: () => encodeShareCode({ shareVersion: 1, view: "viewer", configuration: state.config, values: snapshotFormValues() }),
        openShareCode: async code => {
          const decoded = await decodeShareCode(code);
          loadConfiguration(decoded.config, decoded.mode, decoded.values);
        },
        version: 4
      };
    })();
  </script>
</body>
</html>
