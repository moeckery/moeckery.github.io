<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Boilerplater</title>
  <style>
    :root { color-scheme: light; --background: #fafafa; --foreground: #18181b; --card: #ffffff; --card-foreground: #18181b; --popover: #ffffff; --muted: #f4f4f5; --muted-foreground: #71717a; --accent: #f4f4f5; --accent-foreground: #18181b; --primary: #18181b; --primary-foreground: #fafafa; --border: #e4e4e7; --input: #e4e4e7; --ring: #a1a1aa; --danger: #dc2626; --danger-soft: #fef2f2; --warning: #b45309; --warning-soft: #fffbeb; --success: #15803d; --blue: #2563eb; --blue-soft: #eff6ff; --syntax-key: #2563eb; --syntax-string: #15803d; --syntax-number: #c2410c; --syntax-boolean: #7c3aed; --syntax-keyword: #9333ea; --syntax-variable: #087f8c; --shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 8px 24px rgb(0 0 0 / 0.04); --radius: 10px; --header-height: 58px; --font-sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }

    .start-actions { display: grid; gap: 10px; }
    .start-action { width: 100%; text-align: left; min-height: 70px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); cursor: pointer; color: inherit; display: flex; align-items: center; gap: 12px; }
    .start-action:hover { background: var(--accent); }
    .start-action-copy { min-width: 0; flex: 1; }
    .start-action-icon { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 8px; background: var(--muted); }
    .start-action-icon svg { width: 16px; height: 16px; }

    .start-action-copy strong { display: block; font-size: 12px; margin-bottom: 2px; }
    .start-action-copy > span { display: block; color: var(--muted-foreground); font-size: 11px; line-height: 1.45; }
    .text-button { width: 100%; margin-top: 12px; padding: 6px; border: 0; background: transparent; color: var(--muted-foreground); font-size: 11px; cursor: pointer; }
    .text-button:hover { color: var(--foreground); text-decoration: underline; text-underline-offset: 3px; }

    .pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--card); overflow: hidden; }
    .pane + .pane { border-left: 1px solid var(--border); }
    .pane-header { min-height: 52px; padding: 9px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--border); background: var(--card); }

    .pane-subtitle { margin-top: 2px; color: var(--muted-foreground); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pane-actions { display: flex; align-items: center; gap: 3px; flex: none; }

    .tree-wrap { padding: 7px; }

    .menu-item { width: 100%; min-height: 32px; padding: 0 8px; border: 0; border-radius: 6px; display: flex; align-items: center; gap: 8px; background: transparent; color: var(--foreground); font-size: 11px; text-align: left; cursor: pointer; }
    .menu-item:hover { background: var(--accent); }
    .menu-item svg { width: 14px; height: 14px; color: var(--muted-foreground); }

    .tree-row:hover { background: var(--accent); }

    .tree-indent { flex: none; width: calc(var(--depth, 0) * 15px); }
    .tree-toggle { width: 16px; height: 18px; padding: 0; border: 0; background: transparent; display: grid; place-items: center; flex: none; color: var(--muted-foreground); cursor: pointer; }
    span.tree-toggle { cursor: default; }

    .tree-icon { width: 16px; height: 16px; display: grid; place-items: center; flex: none; color: var(--muted-foreground); }

    .tree-icon.compute { color: #8b5cf6; }
    .tree-name { min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; font-family: var(--font-mono); font-size: 11px; }
    .tree-badge { border: 1px solid var(--border); border-radius: 999px; padding: 1px 5px; color: var(--muted-foreground); font-size: 8px; font-family: var(--font-sans); text-transform: uppercase; letter-spacing: 0.04em; }
    .empty-state { min-height: 100%; display: grid; place-items: center; text-align: center; padding: 28px; color: var(--muted-foreground); }
    .empty-state-inner { max-width: 280px; }

    .editor-shell { height: 100%; display: flex; flex-direction: column; }
    .editor-toolbar { min-height: 38px; padding: 6px 10px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--muted) 45%, var(--card)); }
    .editor-path { min-width: 0; flex: 1; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-mono); font-size: 10px; }
    .code-editor { flex: 1; width: 100%; min-height: 0; resize: none; border: 0; border-radius: 0; padding: 18px 20px 80px; background: var(--card); color: var(--card-foreground); font-family: var(--font-mono); font-size: 12px; line-height: 1.65; tab-size: 2; outline: none !important; white-space: pre; overflow: auto; }
    .file-properties { padding: 13px 16px; border-bottom: 1px solid var(--border); }

    .detail-view { padding: 18px; max-width: 680px; }

    .input::placeholder, .textarea-small::placeholder { color: var(--muted-foreground); opacity: 0.72; }

    .variable-type-status { grid-area: status; }
    .variable-basic-grid > .input, .variable-basic-grid > .select { height: 35px; min-height: 35px; }
    .variable-docs-setting { margin-top: 18px; }
    .side-section { padding: 13px; border-bottom: 1px solid var(--border); }

    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .section-heading h3 { margin: 0; font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted-foreground); }
    .badge { display: inline-flex; align-items: center; min-height: 19px; padding: 1px 6px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted-foreground); background: var(--card); font-size: 9px; font-weight: 620; }
    .badge.blue { color: var(--blue); background: var(--blue-soft); border-color: color-mix(in srgb, var(--blue) 24%, var(--border)); }
    .badge.danger-badge { color: var(--danger); background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 24%, var(--border)); }
    .input-list { display: grid; gap: 7px; }

    button.input-item { cursor: pointer; }
    button.input-item:hover { border-color: var(--ring); background: var(--accent); }
    .input-item.invalid { border-color: color-mix(in srgb, var(--danger) 58%, var(--border)); background: var(--danger-soft); }
    .input-item-icon { color: var(--muted-foreground); display: grid; place-items: center; }

    .input-item-main { min-width: 0; flex: 1; }
    .input-item-name { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-mono); font-size: 10px; line-height: 1.35; }
    .input-item-type { display: block; margin-top: 2px; color: var(--muted-foreground); font-size: 9px; line-height: 1.3; }
    .diagnostic-list { display: grid; gap: 7px; }

    .diagnostic.warning { background: var(--warning-soft); border-color: color-mix(in srgb, var(--warning) 24%, var(--border)); color: var(--warning); }
    .diagnostic.error { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 24%, var(--border)); color: var(--danger); }
    .diagnostic strong { display: block; margin-bottom: 2px; }

    .syntax-disclosure > summary::-webkit-details-marker { display: none; }

    .syntax-row.stacked code { white-space: normal; overflow-wrap: anywhere; }
    .syntax-group-label { margin-top: 5px; color: var(--muted-foreground); font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
    .syntax-group-label:first-child { margin-top: 0; }
    .form-pane-body { padding: 16px; }

    .form-pane-body .template-guide { margin: 18px 0 0; }

    .template-guide h1:first-child, .template-guide h2:first-child, .template-guide h3:first-child, .template-guide h4:first-child { margin-top: 0; }
    .template-guide h1 { font-size: 16px; }

    .template-guide h3, .template-guide h4 { font-size: 12px; }

    .template-guide pre { overflow: auto; padding: 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--card); }
    .template-guide pre code { padding: 0; background: transparent; }

  <div id="app">

    (() => {

        link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"/></svg>',
        rename: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m4 16-1 5 5-1L19 9l-4-4zM13.5 6.5l4 4"/></svg>'
      };

      const ICONIFY_FILE_BASE = "https://api.iconify.design/material-icon-theme";
      const MATERIAL_ICON_LIGHT_VARIANTS = Object.freeze({
        bun: "bun-light",
        hcl: "hcl-light",
        pnpm: "pnpm-light",
        toml: "toml-light"
      });
      const fileIconCache = new Map();
      const FILE_ICON_BY_EXTENSION = Object.freeze({
        yaml: "yaml", yml: "yaml",
        json: "json", jsonc: "json", json5: "json",
        md: "markdown", mdx: "markdown",
        js: "javascript", mjs: "javascript", cjs: "javascript", jsx: "react",
        ts: "typescript", mts: "typescript", cts: "typescript", tsx: "react-ts",
        py: "python", pyi: "python",
        html: "html", htm: "html",
        css: "css", scss: "sass", sass: "sass", less: "less",
        sh: "console", bash: "console", zsh: "console", fish: "console",
        ps1: "powershell", psm1: "powershell", psd1: "powershell",
        tf: "terraform", tfvars: "terraform", hcl: "hcl",
        xml: "xml", sql: "database", toml: "toml",
        ini: "settings", conf: "settings", cfg: "settings", properties: "settings",
        env: "settings", txt: "document", log: "log",
        go: "go", java: "java", kt: "kotlin", kts: "kotlin",
        php: "php", rb: "ruby", rs: "rust",
        c: "c", h: "c", cc: "cpp", cpp: "cpp", cxx: "cpp", hpp: "cpp",
        cs: "csharp", vue: "vue", svelte: "svelte",
        graphql: "graphql", gql: "graphql", proto: "proto",
        lua: "lua", swift: "swift", dart: "dart", groovy: "groovy",
        csv: "table", tsv: "table", xls: "table", xlsx: "table",
        sqlite: "database", db: "database", pdf: "pdf",
        png: "image", jpg: "image", jpeg: "image", gif: "image", webp: "image", avif: "image", ico: "image", bmp: "image",
        mp3: "audio", wav: "audio", flac: "audio", ogg: "audio", m4a: "audio",
        mp4: "video", webm: "video", mov: "video", avi: "video", mkv: "video",
        zip: "zip", gz: "zip", tgz: "zip", tar: "zip", rar: "zip", "7z": "zip"
      });

      function materialFileIconName(name) {
        const base = String(name || "").split(/[\\/]/).pop().trim().toLowerCase();
        if (!base) return null;
        if (base === "dockerfile" || base.startsWith("dockerfile.") || base.endsWith(".dockerfile") || base === ".dockerignore" || /^(docker-)?compose\.ya?ml$/.test(base)) return "docker";
        if ([".gitignore", ".gitattributes", ".gitmodules", ".gitkeep"].includes(base)) return "git";
        if (base === ".env" || base.startsWith(".env.")) return "settings";
        if (["package.json", "package-lock.json", "npm-shrinkwrap.json", ".npmrc"].includes(base)) return "npm";
        if (["pnpm-lock.yaml", "pnpm-workspace.yaml", ".pnpmfile.cjs"].includes(base)) return "pnpm";
        if (["yarn.lock", ".yarnrc", ".yarnrc.yml"].includes(base)) return "yarn";
        if (["bun.lock", "bun.lockb", "bunfig.toml"].includes(base)) return "bun";
        if (/^tsconfig(?:\..+)?\.json$/.test(base)) return "tsconfig";
        if (/^jsconfig(?:\..+)?\.json$/.test(base)) return "jsconfig";
        if (/^(vite|vitest)\.config\./.test(base)) return base.startsWith("vitest") ? "vitest" : "vite";
        if (/^webpack\.config\./.test(base)) return "webpack";
        if (base.startsWith(".eslintrc") || base.startsWith("eslint.config.")) return "eslint";
        if (base.startsWith(".prettierrc") || base.startsWith("prettier.config.")) return "prettier";
        if (/^changelog(\.|$)/.test(base)) return "changelog";
        if (/^(readme|contributing)(\.|$)/.test(base)) return "markdown";
        if (/^(license|licence)(\.|$)/.test(base)) return "license";
        if (base === "jenkinsfile" || base.startsWith("jenkinsfile.")) return "jenkins";
        if (base === "chart.yaml") return "helm";
        if (base === "caddyfile") return "caddy";
        if (base === "nginx.conf") return "nginx";
        if (["requirements.txt", "pipfile", "pipfile.lock"].includes(base)) return "python";
        if (["pyproject.toml", "poetry.lock"].includes(base)) return "poetry";
        if (["go.mod", "go.sum", "go.work"].includes(base)) return "go-mod";
        if (["cargo.toml", "cargo.lock"].includes(base)) return "rust";
        if (base === "cmakelists.txt" || base.endsWith(".cmake")) return "cmake";
        if (/^(build|settings)\.gradle(?:\.kts)?$/.test(base) || base === "gradlew" || base === "gradlew.bat") return "gradle";
        if (base === "terraform.lock.hcl" || base === ".terraform.lock.hcl") return "terraform";
        const extension = base.includes(".") ? base.split(".").pop() : "";
        return FILE_ICON_BY_EXTENSION[extension] || "document";

      function renderFileIcon(name) {
        const baseIconName = materialFileIconName(name);
        const iconName = ui.theme === "light" ? MATERIAL_ICON_LIGHT_VARIANTS[baseIconName] || baseIconName : baseIconName;
        if (!iconName) return icons.file;
        requestFileIcon(iconName);
        const cached = fileIconCache.get(iconName);
        if (cached?.status === "failed") return icons.file;
        const loaded = cached?.status === "ready" && cached.url;
        const classes = ["file-icon-stack"];
        if (loaded) classes.push("loaded");
        return `<span class="${classes.join(" ")}" data-file-icon="${escapeHTML(iconName)}"><span class="file-icon-fallback">${icons.file}</span>${loaded ? `<img class="file-type-icon" src="${escapeHTML(cached.url)}" alt="" aria-hidden="true" decoding="async">` : ""}</span>`;
      }

      function fileIconSelector(iconName) {
        return `.file-icon-stack[data-file-icon="${CSS.escape(iconName)}"]`;
      }

      function failFileIcon(iconName) {
        const cached = fileIconCache.get(iconName);
        if (!cached || cached.status === "failed") return;
        if (cached.url) URL.revokeObjectURL(cached.url);
        cached.status = "failed";
        cached.url = "";
        document.querySelectorAll(fileIconSelector(iconName)).forEach(stack => {
          stack.classList.remove("loaded");
          stack.querySelector(".file-type-icon")?.remove();
        });
      }

      function hydrateFileIcons(iconName) {
        const cached = fileIconCache.get(iconName);
        if (!cached || cached.status !== "ready" || !cached.url) return;
        document.querySelectorAll(fileIconSelector(iconName)).forEach(stack => {
          if (stack.querySelector(".file-type-icon")) {
            stack.classList.add("loaded");
            return;
          }
          const image = document.createElement("img");
          image.className = "file-type-icon";
          image.alt = "";
          image.setAttribute("aria-hidden", "true");
          image.decoding = "async";
          image.addEventListener("load", () => stack.classList.add("loaded"), { once: true });
          image.addEventListener("error", () => failFileIcon(iconName), { once: true });
          image.src = cached.url;
          stack.appendChild(image);
          if (image.complete && image.naturalWidth) stack.classList.add("loaded");
        });
      }

      function requestFileIcon(iconName) {
        if (fileIconCache.has(iconName)) return;
        const cached = { status: "loading", url: "" };

      function escapeHTML(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")

      function renderMarkdownInline(value) {

          .replace(/`([^`]+)`/g, "<code>$1</code>")

      function renderMarkdown(markdown) {
        const lines = String(markdown || "").replace(/\r\n?/g, "\n").split("\n");

          if (!list) return;

          const fence = line.match(/^```\s*([\w-]*)/);
          if (fence) {
            flushParagraph();
            closeList();
            code = { language: fence[1], lines: [] };
            continue;
          }
          const heading = line.match(/^(#{1,4})\s+(.+)$/);
          if (heading) {
            flushParagraph();
            closeList();
            output.push(`<h${heading[1].length}>${renderMarkdownInline(heading[2])}</h${heading[1].length}>`);
            continue;
          }
          const bullet = line.match(/^\s*[-*]\s+(.+)$/);
          const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
          if (bullet || ordered) {
            flushParagraph();
            const type = bullet ? "ul" : "ol";
            if (list !== type) {
              closeList();
              output.push(`<${type}>`);
              list = type;
            }
            output.push(`<li>${renderMarkdownInline((bullet || ordered)[1])}</li>`);
            continue;
          }
          const quote = line.match(/^>\s?(.*)$/);
          if (quote) {
            flushParagraph();
            closeList();
            output.push(`<blockquote>${renderMarkdownInline(quote[1])}</blockquote>`);
            continue;
          }
          if (!line.trim()) {
            flushParagraph();
            closeList();
          } else {
            closeList();
            paragraph.push(line.trim());
          }
        }
        flushParagraph();
        closeList();
        if (code) output.push(`<pre><code>${escapeHTML(code.lines.join("\n"))}</code></pre>`);
        return output.join("");
      }

      function slugifyFileName(value) {
        return String(value || "template")
          .trim()
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "") || "template";
      }

      function humanize(value) {
        const last = String(value || "value").split(".").pop();
        let text = last
          .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
          .replace(/[_-]+/g, " ")
          .trim()
          .toLowerCase();
        text = text.charAt(0).toUpperCase() + text.slice(1);
        if (/^(is|has|can|should|include|enable)\s/i.test(text) && !text.endsWith("?")) text += "?";
        return text;
      }

      function singularize(value) {
        const word = String(value || "item");
        if (word.endsWith("ies")) return word.slice(0, -3) + "y";
        if (word.endsWith("ses")) return word.slice(0, -2);
        if (word.endsWith("s") && !word.endsWith("ss")) return word.slice(0, -1);
        return word;
      }

      function deepClone(value) {
        return JSON.parse(JSON.stringify(value));
      }

      // Configuration model and normalization
      function walkNodes(nodes, visitor, parent = null, ancestry = []) {
        for (const node of nodes || []) {
          const result = visitor(node, parent, ancestry);
          if (result === false) return false;
          if (node.type === "folder" && walkNodes(node.children || [], visitor, node, [...ancestry, node]) === false) return false;
        }
      }

      function findNode(id) {
        let found = null;
        if (!state.config || !id) return null;
        walkNodes(state.config.tree, (node, parent, ancestry) => {
          if (node.id === id) {
            found = { node, parent, ancestry };
            return false;
          }
        });
        return found;
      }

      function findContainerForSelection(placement = "sibling") {
        const found = findNode(state.selectedNodeId);
        if (!found) return { children: state.config.tree, label: "Template root", parentId: null };
        if (placement === "child" && found.node.type === "folder") return { children: found.node.children, label: nodePath(found.node.id), parentId: found.node.id };
        if (found.parent) return { children: found.parent.children, label: nodePath(found.parent.id), parentId: found.parent.id };
        return { children: state.config.tree, label: "Template root", parentId: null };
      }

      function nodePath(id) {
        const found = findNode(id);
        if (!found) return "Template root";
        return [...found.ancestry.map(item => item.name), found.node.name].join(" / ");
      }

      function normalizeNode(node) {
        const type = node && node.type === "file" ? "file" : "folder";
        const normalized = {
          id: typeof node?.id === "string" && node.id ? node.id : uid(),
          type,
          name: typeof node?.name === "string" ? node.name : type === "file" ? "untitled.txt" : "untitled"
        };
        if (type === "file") normalized.content = typeof node?.content === "string" ? node.content : "";
        else normalized.children = Array.isArray(node?.children) ? node.children.map(normalizeNode) : [];
        return normalized;
      }

      function normalizeVariables(input) {
        if (input == null) return {};
        if (typeof input !== "object" || Array.isArray(input)) throw new Error("Variables must be stored as an object.");
        const variables = {};
        for (const [key, raw] of Object.entries(input)) {
          if (!/^[A-Za-z_][\w.-]*$/.test(key)) throw new Error(`Invalid variable name: ${key}`);
          if (!raw || typeof raw !== "object" || Array.isArray(raw)) continue;
          const definition = {};
          if (raw.manual) definition.manual = true;
          if (["auto", "boolean", "choice", "text"].includes(raw.type)) definition.type = raw.type;
          if (typeof raw.label === "string" && raw.label.trim()) definition.label = raw.label.trim();
          if (typeof raw.description === "string" && raw.description.trim()) definition.description = raw.description.trim();
          if (typeof raw.docs === "string" && raw.docs.trim()) definition.docs = raw.docs;
          if (raw.required) definition.required = true;
          if (typeof raw.pattern === "string" && raw.pattern) definition.pattern = raw.pattern;
          if (typeof raw.patternMessage === "string" && raw.patternMessage.trim()) definition.patternMessage = raw.patternMessage.trim();
          if (typeof raw.derive === "string" && raw.derive.trim()) definition.derive = raw.derive.trim();
          if (Object.prototype.hasOwnProperty.call(raw, "default") && ["string", "number", "boolean"].includes(typeof raw.default)) definition.default = raw.default;
          variables[key] = definition;
        }
        return variables;
      }

      function validateAndNormalizeConfig(input) {
        if (!input || typeof input !== "object" || Array.isArray(input)) throw new Error("The configuration must be a JSON object.");
        const source = input.configuration && typeof input.configuration === "object" ? input.configuration : input;
        if (!Array.isArray(source.tree)) throw new Error("This does not look like a Boilerplater configuration: missing tree array.");
        if (source.formatVersion != null && Number(source.formatVersion) !== 1) throw new Error("This configuration uses an unsupported format version.");
        const seen = new Set();
        const tree = source.tree.map(normalizeNode);
        walkNodes(tree, node => {
          if (seen.has(node.id)) node.id = uid();
          seen.add(node.id);
          if (!node.name.trim()) throw new Error("Folder and file names cannot be empty.");
        });
        return {
          formatVersion: 1,
          name: typeof source.name === "string" && source.name.trim() ? source.name.trim() : "Untitled template",
          instructions: typeof source.instructions === "string" ? source.instructions : "",
          variables: normalizeVariables(source.variables),
          tree
        };
      }

      function blankConfig() {
        return { formatVersion: 1, name: "Untitled template", instructions: "", variables: {}, tree: [] };
      }

      const TYPE_SAFETY_RANK = { boolean: 0, choice: 1, text: 2 };

      function resolveTypeSetting(inferredType, requestedType = "auto", inferredOptions = []) {
        const inferred = Object.prototype.hasOwnProperty.call(TYPE_SAFETY_RANK, inferredType) ? inferredType : "text";
        const requested = ["auto", "boolean", "choice", "text"].includes(requestedType) ? requestedType : "auto";
        const invalid = requested !== "auto" && TYPE_SAFETY_RANK[requested] < TYPE_SAFETY_RANK[inferred];
        const type = requested === "auto" || invalid ? inferred : requested;
        let options = null;
        if (type === "choice") {
          options = [...new Set((inferred === "boolean" ? ["false", "true"] : inferredOptions || []).map(String))];
          if (invalid && requested === "boolean") options = [...new Set([...options, "false", "true"])];
        }
        return { inferred, requested, type, invalid, options };
      }

      function parsePredicate(expression) {
        const match = String(expression || "").trim().match(/^([A-Za-z_][\w.-]*)(?:\s*=\s*(.+))?$/);
        if (!match) return null;
        const reference = match[1];
        if (match[2] == null) return { reference, operator: "truthy", value: true, option: "true", usage: "boolean" };
        const raw = match[2].trim();
        if (!raw) return null;
        let value = raw;
        const quote = raw[0];
        if (quote === '"' || quote === "'") {
          if (raw.length < 2 || raw.at(-1) !== quote) return null;
          try {
            value = quote === '"' ? JSON.parse(raw) : raw.slice(1, -1).replace(/\\(['\\])/g, "$1");
          } catch {
            return null;
          }
        } else if (/\s/.test(raw)) {
          return null;
        }
        value = String(value);
        const isBoolean = /^(true|false)$/i.test(value);
        const option = isBoolean ? value.toLowerCase() : value;
        return { reference, operator: "equals", value: isBoolean ? option === "true" : value, option, usage: isBoolean ? "boolean" : "choice" };
      }

      function predicateMatches(predicate, bindings) {
        const actual = getReference(predicate.reference, bindings);
        if (predicate.operator === "equals") {
          if (/^(true|false)$/.test(predicate.option)) return String(actual).toLowerCase() === predicate.option;
          return String(actual) === predicate.option;
        }
        return actual === true || String(actual).toLowerCase() === "true";
      }

      function parseLoopClause(expression) {
        const match = String(expression || "").trim().match(/^for\s+(.+?)\s+in\s+([A-Za-z_][\w.-]*)$/i);
        if (!match) return null;
        const target = match[1].trim();
        const collection = match[2];
        if (/^[A-Za-z_][\w-]*$/.test(target)) return { alias: target, bindings: [target], destructured: false, collection };
        const tuple = target.match(/^\(([^)]+)\)$/);
        if (!tuple) return null;
        const bindings = tuple[1].split(",").map(value => value.trim()).filter(Boolean);
        if (bindings.length < 2 || new Set(bindings).size !== bindings.length || bindings.some(value => !/^[A-Za-z_][\w-]*$/.test(value))) return null;
        return { alias: null, bindings, destructured: true, collection };
      }

      function bindLoopItem(loop, item, bindings = {}) {
        if (loop.destructured) return { ...bindings, ...Object.fromEntries(loop.bindings.map(name => [name, item?.[name]])) };
        return { ...bindings, [loop.alias]: item };
      }

      function parseCompute(name) {
        const value = String(name || "").trim();
        let match = value.match(/^\(group\s+(.+)\)$/i);
        if (match) return { type: "group", label: match[1].trim() };
        match = value.match(/^\((for\s+.+)\)$/i);
        if (match) {
          const loop = parseLoopClause(match[1]);
          if (loop) return { type: "for", ...loop };
        }
        match = value.match(/^\(when\s+(not\s+)?(.+)\)$/i);
        if (match) {
          const predicate = parsePredicate(match[2]);
          if (predicate) return { type: "when", negate: Boolean(match[1]), ...predicate };
        }
        return null;
      }

      function normalizeStandaloneTemplateTags(template) {
        return String(template || "").replace(/^[\t ]*({{\s*(?:#(?:if|unless|for)\b[^{}\r\n]*|else|\/(?:if|unless|for)|![^{}\r\n]*)\s*}})[\t ]*(?:\r?\n|$)/gm, "$1");
      }

      function parseContentTemplate(template) {
        const input = normalizeStandaloneTemplateTags(template);
        const root = [];
        const errors = [];
        const stack = [{ kind: "root", children: root, node: null, inElse: false }];
        const tokens = /{{([\s\S]*?)}}/g;
        let cursor = 0;
        const append = node => stack.at(-1).children.push(node);
        const appendText = value => { if (value) append({ type: "text", value }); };

        for (const match of input.matchAll(tokens)) {
          appendText(input.slice(cursor, match.index));
          const raw = match[0];
          const tag = match[1].trim();
          cursor = match.index + raw.length;

          if (tag.startsWith("!")) continue;
          if (tag === "else") {
            const frame = stack.at(-1);
            if (frame.kind === "root" || frame.inElse) {
              errors.push("Unexpected {{else}}.");
              appendText(raw);
            } else {
              frame.inElse = true;
              frame.children = frame.node.alternate;
            }
            continue;
          }
          if (tag.startsWith("/")) {
            const closing = tag.slice(1).trim();
            const frame = stack.at(-1);
            if (frame.kind === closing) stack.pop();
            else {
              errors.push(`Unexpected closing tag {{/${closing}}}.`);
              appendText(raw);
            }
            continue;
          }
          if (tag.startsWith("#")) {
            const expression = tag.slice(1).trim();
            let node = null;
            const condition = expression.match(/^(if|unless)\s+(.+)$/);
            const loop = parseLoopClause(expression);
            if (condition) {
              const predicate = parsePredicate(condition[2]);
              if (predicate) node = { type: "block", kind: condition[1], predicate, children: [], alternate: [] };
              else errors.push(`Invalid condition: ${condition[2].trim()}.`);
            } else if (loop) {
              node = { type: "block", kind: "for", ...loop, children: [], alternate: [] };
            } else {
              errors.push(`Unknown block: {{${tag}}}.`);
            }
            if (!node) {
              appendText(raw);
              continue;
            }
            append(node);
            stack.push({ kind: node.kind, children: node.children, node, inElse: false });
            continue;
          }
          if (/^[A-Za-z_][\w.-]*$/.test(tag)) append({ type: "variable", reference: tag });
          else appendText(raw);
        }

        appendText(input.slice(cursor));
        for (const frame of stack.slice(1)) errors.push(`Missing {{/${frame.kind}}}.`);
        return { nodes: root, errors };
      }

      // Template analysis and type inference
      function analyzeConfiguration() {
        const globals = new Map();
        const collections = new Map();
        const diagnostics = [];
        const references = [];
        const loopBindings = new Map();

        const addUsage = (field, usage, option) => {
          field.textUsed ||= usage === "text";
          field.booleanUsed ||= usage === "boolean";
          if (usage === "boolean" && option != null && !field.booleanOptions.includes(String(option))) field.booleanOptions.push(String(option));
          if (usage === "choice" && option != null && !field.choiceOptions.includes(String(option))) field.choiceOptions.push(String(option));
          field.type = field.choiceOptions.length ? "choice" : field.booleanUsed ? "boolean" : "text";
          field.options = field.type === "choice" ? [...new Set([...field.booleanOptions, ...field.choiceOptions])] : null;
        };

        const ensureGlobal = (reference, usage = "text", option = null, source = "template") => {
          if (!reference) return;
          let field = globals.get(reference);
          if (!field) {
            field = { key: reference, label: humanize(reference), type: "text", options: null, textUsed: false, booleanUsed: false, booleanOptions: [], choiceOptions: [], source };
            globals.set(reference, field);
          }
          addUsage(field, usage, option);
          references.push(reference);
        };

        const ensureCollection = (collection, alias) => {
          const existing = collections.get(collection);
          if (existing && alias && existing.alias && existing.alias !== alias) {
            diagnostics.push({ level: "warning", title: "Collection uses multiple aliases", message: `${collection} is referenced as both ${existing.alias} and ${alias}.` });
          }
          if (!existing) collections.set(collection, { key: collection, alias: alias || singularize(collection), objectAliases: new Set(alias ? [alias] : []), label: humanize(collection), fields: new Map(), directFields: new Set() });
          const result = collections.get(collection);
          if (alias) result.objectAliases.add(alias);
          return result;
        };

        const loopScope = (scope, loop) => {
          const next = { aliases: new Map(scope.aliases) };
          if (loop.destructured) {
            for (const name of loop.bindings) {
              next.aliases.set(name, { collection: loop.collection, field: name, alias: null });
              if (!loopBindings.has(name)) loopBindings.set(name, new Set());
              loopBindings.get(name).add(loop.collection);
            }
          } else {
            next.aliases.set(loop.alias, { collection: loop.collection, field: null, alias: loop.alias, bareUsed: false, dottedUsed: false });
            if (!loopBindings.has(loop.alias)) loopBindings.set(loop.alias, new Set());
            loopBindings.get(loop.alias).add(loop.collection);
          }
          return next;
        };

        const register = (reference, usage, scope, option = null, source = "template") => {
          if (!reference) return;
          const first = reference.split(".")[0];
          const scoped = scope.aliases.get(first);
          if (scoped) {
            const collection = ensureCollection(scoped.collection, scoped.alias);
            const suffix = reference.includes(".") ? reference.slice(first.length + 1) : "";
            let field;
            let definitionReference;
            if (scoped.field) {
              field = suffix ? `${scoped.field}.${suffix}` : scoped.field;
              collection.directFields.add(scoped.field);
              definitionReference = `${scoped.collection}.${field}`;
            } else if (suffix) {
              scoped.dottedUsed = true;
              field = suffix;
              definitionReference = reference;
            } else {
              scoped.bareUsed = true;
              field = scoped.alias || first;
              collection.directFields.add(field);
              definitionReference = `${scoped.collection}.${field}`;
            }
            let current = collection.fields.get(field);
            if (!current) {
              current = { key: field, reference: definitionReference, templateReference: reference, label: humanize(field), type: "text", options: null, textUsed: false, booleanUsed: false, booleanOptions: [], choiceOptions: [], source };
              collection.fields.set(field, current);
            }
            addUsage(current, usage, option);
          } else {
            ensureGlobal(reference, usage, option, source);
          }
        };

        const scanText = (text, scope, source) => {
          const parsed = parseContentTemplate(text);
          for (const message of parsed.errors) diagnostics.push({ level: "warning", title: "Invalid file template", message: `${message} In ${source}.` });
          const scanNodes = (nodes, activeScope) => {
            for (const node of nodes) {
              if (node.type === "variable") {
                register(node.reference, "text", activeScope, null, source);
                continue;
              }
              if (node.type !== "block") continue;
              if (node.kind === "for") {
                if (node.collection.includes(".")) diagnostics.push({ level: "warning", title: "Nested collection", message: "Nested collections are not editable in the generated form yet." });
                ensureCollection(node.collection, node.alias);
                const scopedLoop = loopScope(activeScope, node);
                if (node.destructured) for (const name of node.bindings) register(name, "text", scopedLoop, null, source);
                scanNodes(node.children, scopedLoop);
                if (!node.destructured) {
                  const binding = scopedLoop.aliases.get(node.alias);
                  if (!binding.bareUsed && !binding.dottedUsed) register(node.alias, "text", scopedLoop, null, source);
                }
                scanNodes(node.alternate, activeScope);
              } else {
                register(node.predicate.reference, node.predicate.usage, activeScope, node.predicate.option, source);
                scanNodes(node.children, activeScope);
                scanNodes(node.alternate, activeScope);
              }
            }
          };
          scanNodes(parsed.nodes, scope);
        };

        const scanName = (name, scope, source) => {
          const token = /\[\[\s*([A-Za-z_][\w.-]*)\s*]]/g;
          for (const match of name.matchAll(token)) register(match[1], "text", scope, null, source);
        };

        const visit = (nodes, scope, sourcePath = []) => {
          for (const node of nodes) {
            const path = [...sourcePath, node.name];
            if (!node.name.trim()) {
              diagnostics.push({ level: "error", title: "Name required", message: `A ${node.type} has an empty name.` });
            }
            if (node.type === "folder") {
              const compute = parseCompute(node.name);
              if (!compute && /^\(.*\)$/.test(node.name.trim())) {
                diagnostics.push({ level: "warning", title: "Unknown logic syntax", message: `${node.name} will be generated as a normal folder.` });
              }
              if (compute?.type === "for") {
                if (compute.collection.includes(".")) {
                  diagnostics.push({ level: "warning", title: "Nested collection", message: "Nested collections are not editable in the generated form yet." });
                }
                ensureCollection(compute.collection, compute.alias);
                const scopedLoop = loopScope(scope, compute);
                if (compute.destructured) for (const name of compute.bindings) register(name, "text", scopedLoop, null, path.join(" / "));
                visit(node.children, scopedLoop, path);
                if (!compute.destructured) {
                  const binding = scopedLoop.aliases.get(compute.alias);
                  if (!binding.bareUsed && !binding.dottedUsed) register(compute.alias, "text", scopedLoop, null, path.join(" / "));
                }
              } else if (compute?.type === "when") {
                register(compute.reference, compute.usage, scope, compute.option, path.join(" / "));
                visit(node.children, scope, path);
              } else {
                if (!compute) scanName(node.name, scope, path.join(" / "));
                visit(node.children, scope, path);
              }
            } else {
              scanName(node.name, scope, path.join(" / "));
              scanText(node.content, scope, path.join(" / "));
            }
          }
        };

        if (state.config) visit(state.config.tree, { aliases: new Map() });

        for (const field of globals.values()) {
          const root = field.key.split(".")[0];
          const matchingCollections = [...(loopBindings.get(root) || [])];
          if (!matchingCollections.length) continue;
          diagnostics.push({
            level: "warning",
            title: "Loop binding used outside its loop",
            message: `${field.key} is outside the ${matchingCollections.join(" / ")} loop scope, so it becomes a shared value. Move this item inside the loop to make it a per-item field.`
          });
        }

        const definitions = state.config?.variables || {};
        const findCollectionField = reference => {
          for (const collection of collections.values()) {
            for (const field of collection.fields.values()) if (field.reference === reference) return field;
          }
          return null;
        };

        for (const [reference, definition] of Object.entries(definitions)) {
          if (!definition.manual || globals.has(reference) || findCollectionField(reference)) continue;
          if (collections.has(reference)) {
            diagnostics.push({ level: "error", title: "Reserved variable name", message: `${reference} is already used as a collection name.` });
            continue;
          }
          ensureGlobal(reference, "text", null, "Manual variable");
        }

        const applyDefinition = (field, reference) => {
          const definition = definitions[reference] || {};
          const inferredType = field.type || "text";
          const inferredOptions = field.options ? [...field.options] : [];
          const typeSetting = resolveTypeSetting(inferredType, definition.type || "auto", inferredOptions);
          const { type, options } = typeSetting;
          if (definition.pattern) {
            try { new RegExp(definition.pattern); }
            catch { diagnostics.push({ level: "error", title: "Invalid validation pattern", message: `${reference} has an invalid regular expression.` }); }
          }
          if (typeSetting.invalid) {
            diagnostics.push({
              level: "warning",
              title: "Unsafe type setting ignored",
              message: `${reference} is inferred as ${fieldTypeLabel(inferredType).toLowerCase()}, so ${fieldTypeLabel(typeSetting.requested).toLowerCase()} would lose information. The form uses ${fieldTypeLabel(type).toLowerCase()}.`
            });
          }
          Object.assign(field, {
            reference: field.reference || reference,
            inferredType,
            inferredOptions,
            requestedType: typeSetting.requested,
            typeSettingError: typeSetting.invalid,
            type,
            options,
            label: definition.label || field.label || humanize(reference),
            description: definition.description || "",
            docs: definition.docs || "",
            required: Boolean(definition.required),
            pattern: definition.pattern || "",
            patternMessage: definition.patternMessage || "",
            derive: definition.derive || "",
            manual: Boolean(definition.manual),
            customized: Object.keys(definition).some(key => key !== "manual")
          });
          if (Object.prototype.hasOwnProperty.call(definition, "default")) {
            field.default = definition.default;
            field.hasDefault = true;
          } else {
            field.hasDefault = false;
          }
        };

        for (const field of globals.values()) applyDefinition(field, field.key);
        for (const collection of collections.values()) {
          for (const field of collection.fields.values()) applyDefinition(field, field.reference);
        }

        const visiting = new Set();
        const visited = new Set();
        let cycleReported = false;
        const checkDerived = reference => {
          if (visited.has(reference) || cycleReported) return;
          if (visiting.has(reference)) {
            diagnostics.push({ level: "error", title: "Derived value cycle", message: `Derived variables cannot depend on themselves: ${reference}.` });
            cycleReported = true;
            return;
          }
          const template = definitions[reference]?.derive;
          if (!template) return visited.add(reference);
          visiting.add(reference);
          for (const match of template.matchAll(/{{\s*([A-Za-z_][\w.-]*)\s*}}/g)) {
            if (definitions[match[1]]?.derive) checkDerived(match[1]);
          }
          visiting.delete(reference);
          visited.add(reference);
        };
        for (const reference of Object.keys(definitions)) checkDerived(reference);

        return { globals, collections, diagnostics, references };
      }

      function newCollectionItem(collection) {
        const item = { __id: uid() };
        for (const field of collection.fields.values()) item[field.key] = initialFieldValue(field);
        return item;
      }

      function coerceFieldValue(field, value) {
        if (field.type === "boolean") {
          if (typeof value === "boolean") return value;
          return /^(true|1|yes|on)$/i.test(String(value || ""));
        }
        if (field.type === "number") return value == null ? "" : String(value);
        return value == null ? "" : String(value);
      }

      function initialFieldValue(field) {
        if (field.hasDefault) return coerceFieldValue(field, field.default);
        if (field.type === "boolean") return false;
        if (field.type === "choice") return field.options?.[0] || "";
        return "";
      }

      function renderDerivedValue(template, bindings) {
        return String(template || "").replace(/{{\s*([A-Za-z_][\w.-]*)\s*}}/g, (_, reference) => {
          const value = getReference(reference, bindings);
          return value == null ? "" : String(value);
        });
      }

      function applyDerivedValues(analysis = state.analysis) {
        if (!analysis) return;
        const fieldCount = analysis.globals.size + [...analysis.collections.values()].reduce((total, collection) => total + collection.fields.size, 0);
        for (let pass = 0; pass <= fieldCount; pass += 1) {
          let changed = false;
          for (const field of analysis.globals.values()) {
            if (!field.derive) continue;
            const next = coerceFieldValue(field, renderDerivedValue(field.derive, {}));
            if (state.values.globals[field.key] !== next) {
              state.values.globals[field.key] = next;
              changed = true;
            }
          }
          for (const collection of analysis.collections.values()) {
            for (const item of state.values.collections[collection.key] || []) {
              const bindings = Object.fromEntries([...collection.directFields].map(name => [name, item[name]]));
              for (const alias of collection.objectAliases) bindings[alias] = item;
              for (const field of collection.fields.values()) {
                if (!field.derive) continue;
                const next = coerceFieldValue(field, renderDerivedValue(field.derive, bindings));
                if (item[field.key] !== next) {
                  item[field.key] = next;
                  changed = true;
                }
              }
            }
          }
          if (!changed) break;
        }
      }

      function syncValues() {
        const analysis = state.analysis || analyzeConfiguration();
        state.analysis = analysis;
        for (const field of analysis.globals.values()) {
          if (!(field.key in state.values.globals)) state.values.globals[field.key] = initialFieldValue(field);
          else state.values.globals[field.key] = coerceFieldValue(field, state.values.globals[field.key]);
        }
        for (const collection of analysis.collections.values()) {
          if (!Array.isArray(state.values.collections[collection.key]) || state.values.collections[collection.key].length === 0) {
            state.values.collections[collection.key] = [newCollectionItem(collection)];
          } else {
            for (const item of state.values.collections[collection.key]) {
              if (!item.__id) item.__id = uid();
              for (const field of collection.fields.values()) {
                if (!(field.key in item)) {
                  const legacyPrimaryValue = collection.objectAliases.has(field.key)
                    && !collection.fields.has("name")
                    && Object.prototype.hasOwnProperty.call(item, "name")
                    ? item.name
                    : undefined;
                  item[field.key] = legacyPrimaryValue === undefined ? initialFieldValue(field) : coerceFieldValue(field, legacyPrimaryValue);
                }
                else item[field.key] = coerceFieldValue(field, item[field.key]);
              }
            }
          }
        }
        applyDerivedValues(analysis);
      }

      function getReference(reference, bindings) {
        const parts = String(reference).split(".");
        const alias = parts[0];
        if (bindings && Object.prototype.hasOwnProperty.call(bindings, alias)) {
          let value = bindings[alias];
          const rest = parts.slice(1);
          if (rest.length === 0 && value && typeof value === "object") {
            if (Object.prototype.hasOwnProperty.call(value, alias)) return value[alias];
            return value.name ?? "";
          }
          for (const part of rest) value = value == null ? undefined : value[part];
          return value;
        }
        if (Object.prototype.hasOwnProperty.call(state.values.globals, reference)) return state.values.globals[reference];
        return undefined;
      }

      function interpolatePath(value, bindings, diagnostics, source) {
        return String(value).replace(/\[\[\s*([A-Za-z_][\w.-]*)\s*]]/g, (_, reference) => {
          const resolved = getReference(reference, bindings);
          if (resolved == null || String(resolved).trim() === "") {
            diagnostics.push({ level: "error", title: "Required name is empty", message: `${reference} is needed by ${source}.` });
            return `‹${reference}›`;
          }
          const text = String(resolved);
          if (/[\\/\0]/.test(text) || text === "." || text === "..") {
            diagnostics.push({ level: "error", title: "Unsafe path value", message: `${reference} must resolve to one safe folder or file-name segment.` });
            return `‹invalid-${reference}›`;
          }
          return text;
        });
      }

      function renderContent(template, bindings) {
        const parsed = parseContentTemplate(template);
        const renderNodes = (nodes, activeBindings) => nodes.map(node => {
          if (node.type === "text") return node.value;
          if (node.type === "variable") {
            const value = getReference(node.reference, activeBindings);
            return value == null ? `{{${node.reference}}}` : String(value);
          }
          if (node.type !== "block") return "";
          if (node.kind === "for") {
            const scopedItems = getReference(node.collection, activeBindings);
            const items = Array.isArray(scopedItems) ? scopedItems : state.values.collections[node.collection] || [];
            if (!items.length) return renderNodes(node.alternate, activeBindings);
            return items.map(item => renderNodes(node.children, bindLoopItem(node, item, activeBindings))).join("");
          }
          const matches = predicateMatches(node.predicate, activeBindings);
          const includeFirst = node.kind === "if" ? matches : !matches;
          return renderNodes(includeFirst ? node.children : node.alternate, activeBindings);
        }).join("");
        return renderNodes(parsed.nodes, bindings || {}).replace(/^\s*\n/, "");
      }

      function validateFieldValue(field, value) {
        const empty = value == null || String(value).trim() === "";
        if (field.required && (empty || (field.type === "boolean" && value !== true))) return `${field.label} is required.`;
        if (empty) return "";
        if (field.type === "number" && !Number.isFinite(Number(value))) return `${field.label} must be a number.`;
        if (field.type === "choice" && field.options?.length && !field.options.includes(String(value))) return `Choose a valid ${field.label.toLowerCase()} option.`;
        if (field.pattern) {
          try {
            if (!new RegExp(field.pattern).test(String(value))) return field.patternMessage || `${field.label} has an invalid format.`;
          } catch {}
        }
        return "";
      }

      function collectValueDiagnostics() {
        const diagnostics = [];
        for (const field of state.analysis?.globals.values() || []) {
          const message = validateFieldValue(field, state.values.globals[field.key]);
          if (message) diagnostics.push({ level: "error", title: field.label, message });
        }
        for (const collection of state.analysis?.collections.values() || []) {
          for (const [index, item] of (state.values.collections[collection.key] || []).entries()) {
            for (const field of collection.fields.values()) {
              const message = validateFieldValue(field, item[field.key]);
              if (message) diagnostics.push({ level: "error", title: `${field.label} · ${index + 1}`, message });
            }
          }
        }
        return diagnostics;
      }

      // Output generation engine
      function renderOutput() {
        const diagnostics = [...(state.analysis?.diagnostics || []), ...collectValueDiagnostics()];
        const pathMap = new Map();
        let fileCount = 0;

        const renderNodes = (nodes, bindings = {}, basePath = "") => {
          const output = [];
          for (const node of nodes) {
            if (node.type === "folder") {
              const compute = parseCompute(node.name);
              if (compute?.type === "group") {
                output.push(...renderNodes(node.children, bindings, basePath));
                continue;
              }
              if (compute?.type === "for") {
                const items = state.values.collections[compute.collection] || [];
                for (const item of items) output.push(...renderNodes(node.children, bindLoopItem(compute, item, bindings), basePath));
                continue;
              }
              if (compute?.type === "when") {
                const matches = predicateMatches(compute, bindings);
                if ((compute.negate ? !matches : matches)) output.push(...renderNodes(node.children, bindings, basePath));
                continue;
              }
              const name = interpolatePath(node.name, bindings, diagnostics, node.name);
              const path = basePath ? `${basePath}/${name}` : name;
              const children = renderNodes(node.children, bindings, path);
              const result = { id: `${node.id}:${path}`, sourceNodeId: node.id, type: "folder", name, path, children };
              registerOutputPath(result);
              output.push(result);
            } else {
              const name = interpolatePath(node.name, bindings, diagnostics, node.name);
              const path = basePath ? `${basePath}/${name}` : name;
              const content = renderContent(node.content, bindings);
              const result = { id: `${node.id}:${path}:${JSON.stringify(bindings)}`, sourceNodeId: node.id, type: "file", name, path, content };
              fileCount += 1;
              registerOutputPath(result);
              output.push(result);
            }
          }
          return output;
        };

        const registerOutputPath = result => {
          const key = result.path.toLocaleLowerCase();
          if (pathMap.has(key)) diagnostics.push({ level: "error", title: "Output collision", message: `${result.path} is generated more than once.` });
          else pathMap.set(key, result);
        };

        const tree = renderNodes(state.config?.tree || []);
        return { tree, diagnostics, pathMap, fileCount };
      }

      function recompute() {
        state.analysis = analyzeConfiguration();
        syncValues();
        state.rendered = renderOutput();
      }

      // Application actions, persistence, and sharing
      function setDirty(value = true) {
        state.dirty = value;
        scheduleLocalSave();
      }

      function scheduleLocalSave() {
        clearTimeout(state.saveTimer);
        if (state.mode === "viewer") return;
        state.saveTimer = setTimeout(() => {
          if (!state.config) return;
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
              savedAt: new Date().toISOString(),
              config: state.config,
              values: state.values,
              mode: state.mode
            }));
            updateResume();
          } catch (error) {
            console.warn("Could not save local draft", error);
          }
        }, 300);
      }

      function updateResume() {
        ui.resume = null;
        try {
          const draft = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          if (!draft?.config?.tree) return;
          const date = draft.savedAt ? new Date(draft.savedAt) : null;
          ui.resume = {
            title: draft.config.name || "Untitled template",
            description: date && !Number.isNaN(date.getTime())
              ? "Saved " + date.toLocaleString()
              : "Return to your last template."
          };
        } catch {}
      }

      function resumeDraft() {
        try {
          const draft = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          if (!draft?.config) throw new Error("No local draft was found.");
          loadConfiguration(draft.config, draft.mode === "fill" ? "fill" : "configure", draft.values);
        } catch (error) {
          toast(error.message, "error");
        }
      }

      function setMode(mode) {
        if (state.mode === "viewer" || !["fill", "configure"].includes(mode)) return;
        state.mode = mode;
        recompute();
        ensureOutputSelection();
        scheduleLocalSave();
      }

      function selectedInfo() {
        return findNode(state.selectedNodeId);
      }

      function selectedKind() {
        const selected = selectedInfo();
        if (!selected) return "Editor";
        if (selected.node.type === "file") return "File";
        return parseCompute(selected.node.name) ? "Logic folder" : "Folder";
      }

      function folderExplanation(compute) {
        if (!compute) return "Appears in the generated path. Put [[value]] in the name when this segment should come from the form.";
        if (compute.type === "group") return "Organizes “" + compute.label + "” without creating an output folder.";
        if (compute.type === "for") return compute.destructured
          ? "Creates its children for every item in " + compute.collection + ", exposing " + compute.bindings.join(" and ") + "."
          : "Creates its children for every item in " + compute.collection + ", available as " + compute.alias + ".";
        if (compute.operator === "equals") return "Creates its children when " + compute.reference + (compute.negate ? " does not equal “" : " equals “") + compute.option + "”.";
        return "Creates its children when " + compute.reference + " is " + (compute.negate ? "unchecked." : "checked.");
      }

      function contextualSyntax() {
        const selected = selectedInfo();
        if (!selected) return {
          title: "Template syntax",
          groups: [{ label: "", rows: [
            ["[[value]]", "Use a value in folder and file names"],
            ["{{value}}", "Use a value in file content"]
          ] }]
        };
        if (selected.node.type === "file") return {
          title: "File syntax",
          groups: [
            { label: "File name", rows: [
              ["[[name]]", "Dynamic file-name segment"],
              ["document-[[variant]].txt", "Combine text and a value"]
            ] },
            { label: "Content", rows: [
              ["{{value}}", "Insert a value"],
              ["{{#if flag}} … {{else}} … {{/if}}", "Conditional content"],
              ["{{#if mode=compact}} … {{/if}}", "Match a choice value"],
              ["{{#unless mode=compact}} … {{/unless}}", "Content shown for other values"],
              ["{{#for item in items}} … {{/for}}", "Repeat content"],
              ["{{#for (name, variant) in items}} … {{/for}}", "Expose multiple item fields"]
            ] }
          ]
        };
        if (parseCompute(selected.node.name)) return {
          title: "Logic folder syntax",
          groups: [{ label: "", rows: [
            ["(group label)", "Organize without an output folder"],
            ["(for item in items)", "Repeat descendants"],
            ["(for (name, variant) in items)", "Expose multiple fields directly"],
            ["(when flag)", "Include when checked"],
            ["(when not flag)", "Include when unchecked"],
            ["(when mode=compact)", "Include for a choice value"],
            ["(when not mode=compact)", "Include for other values"]
          ] }]
        };
        return {
          title: "Folder syntax",
          groups: [{ label: "", rows: [
            ["[[name]]", "Dynamic folder-name segment"],
            ["section-[[variant]]", "Combine text and a value"]
          ] }]
        };
      }

      function findAnalyzedField(reference) {
        if (state.analysis?.globals.has(reference)) return state.analysis.globals.get(reference);
        for (const collection of state.analysis?.collections.values() || []) {
          for (const field of collection.fields.values()) if (field.reference === reference) return field;
        }
        return null;
      }

      function fieldTypeLabel(type) {
        return ({ auto: "Auto", boolean: "Boolean", choice: "Choice", text: "Text" })[type] || "Text";
      }

      function typeSettingFeedback(field, requestedType) {
        const setting = resolveTypeSetting(field?.inferredType || "text", requestedType, field?.inferredOptions || []);
        return {
          setting,
          message: setting.invalid
            ? fieldTypeLabel(requestedType) + " cannot represent every value required by this template. " + fieldTypeLabel(setting.type) + " is used instead."
            : ""
        };
      }

      function inspectorItems() {
        if (!state.analysis) return [];
        const items = [];
        const meta = (field, fallback) => field.typeSettingError
          ? "Requested " + fieldTypeLabel(field.requestedType) + " · using " + fieldTypeLabel(field.type)
          : field.requestedType !== "auto" && field.requestedType !== field.inferredType
            ? fieldTypeLabel(field.inferredType) + " → " + fieldTypeLabel(field.type)
            : fallback;
        for (const field of state.analysis.globals.values()) {
          items.push({ name: field.key, type: field.type, meta: meta(field, field.derive ? "Derived" : field.manual ? "Manual" : "Shared"), key: field.key, editable: true, invalid: field.typeSettingError });
        }
        for (const collection of state.analysis.collections.values()) {
          const count = collection.fields.size;
          items.push({ name: collection.key, type: "collection", meta: count + " item " + (count === 1 ? "field" : "fields"), editable: false });
          for (const field of collection.fields.values()) {
            items.push({ name: field.templateReference || field.reference, type: field.type, meta: meta(field, field.derive ? "Derived per item" : "Per item"), key: field.reference, editable: true, nested: true, invalid: field.typeSettingError });
          }
        }
        return items;
      }

      function documentedFields() {
        const result = [];
        const seen = new Set();
        const add = field => {
          if (!field?.docs?.trim() || seen.has(field.reference)) return;
          seen.add(field.reference);
          result.push(field);
        };
        for (const field of state.analysis?.globals.values() || []) add(field);
        for (const collection of state.analysis?.collections.values() || []) {
          for (const field of collection.fields.values()) add(field);
        }
        return result;
      }

      function outputErrors() {
        return state.rendered?.diagnostics.filter(item => item.level === "error") || [];
      }

      function updateFormValue(field, value, collection = "", index = -1) {
        if (state.mode === "viewer") return;
        if (collection) {
          const item = state.values.collections[collection]?.[index];
          if (item) item[field] = value;
        } else {
          state.values.globals[field] = value;
        }
        applyDerivedValues();
        state.rendered = renderOutput();
        ensureOutputSelection();
        scheduleLocalSave();
      }

      function resetValues() {
        state.values = { globals: {}, collections: {} };
        recompute();
        ensureOutputSelection();
        scheduleLocalSave();
      }

      function addCollectionItem(key) {
        const collection = state.analysis?.collections.get(key);
        if (!collection) return;
        state.values.collections[key].push(newCollectionItem(collection));
        applyDerivedValues();
        state.rendered = renderOutput();
        scheduleLocalSave();
      }

      function removeCollectionItem(key, index) {
        const list = state.values.collections[key];
        if (list?.length > 1) list.splice(index, 1);
        state.rendered = renderOutput();
        ensureOutputSelection();
        scheduleLocalSave();
      }

      function previewLanguage(name) {
        const base = String(name || "").split(/[\\/]/).pop().toLowerCase();
        if (base === "dockerfile" || base.startsWith("dockerfile.") || base.endsWith(".dockerfile")) return "dockerfile";
        if (/\.ya?ml$/.test(base)) return "yaml";
        if (/\.json$/.test(base)) return "json";
        return "plain";
      }

      function highlightAtoms(text, mode = "plain") {
        const pattern = /{{[A-Za-z_][\w.-]*}}|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b(?:true|false|null|yes|no|on|off)\b|-?\d+(?:\.\d+)?/gi;
        let output = "";
        let cursor = 0;
        for (const match of String(text).matchAll(pattern)) {
          output += escapeHTML(text.slice(cursor, match.index));
          const token = match[0];
          let className = "syntax-number";
          if (token.startsWith("{{")) className = "unresolved";
          else if (token.startsWith('"') || token.startsWith("'")) {
            const after = text.slice(match.index + token.length);
            className = mode === "json" && /^\s*:/.test(after) ? "syntax-key" : "syntax-string";
          } else if (/^(true|false|null|yes|no|on|off)$/i.test(token)) className = "syntax-boolean";
          output += `<span class="${className}">${escapeHTML(token)}</span>`;
          cursor = match.index + token.length;
        }
        return output + escapeHTML(text.slice(cursor));
      }

      function splitYamlComment(line) {
        let quote = "";
        for (let index = 0; index < line.length; index += 1) {
          const character = line[index];
          if (quote) {
            if (character === quote && line[index - 1] !== "\\") quote = "";
          } else if (character === '"' || character === "'") quote = character;
          else if (character === "#" && (index === 0 || /\s/.test(line[index - 1]))) return [line.slice(0, index), line.slice(index)];
        }
        return [line, ""];
      }

      function highlightYamlLine(line) {
        const [body, comment] = splitYamlComment(line);
        const mapping = body.match(/^(\s*)(-\s+)?([A-Za-z0-9_.-]+)(\s*:\s*)(.*)$/);
        let output;
        if (mapping) {
          output = escapeHTML(mapping[1] + (mapping[2] || ""));
          output += `<span class="syntax-key">${escapeHTML(mapping[3])}</span>${escapeHTML(mapping[4])}`;
          output += highlightAtoms(mapping[5], "yaml");
        } else {
          output = highlightAtoms(body, "yaml");
        }
        if (comment) output += `<span class="syntax-comment">${escapeHTML(comment)}</span>`;
        return output;
      }

      function highlightDockerArguments(text) {
        const pattern = /{{[A-Za-z_][\w.-]*}}|--[a-z][\w-]*(?:=[^\s]+)?|\$\{?[A-Za-z_][A-Za-z0-9_]*}?|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'/gi;
        let output = "";
        let cursor = 0;
        for (const match of String(text).matchAll(pattern)) {
          output += highlightAtoms(text.slice(cursor, match.index));
          const token = match[0];
          const className = token.startsWith("{{") ? "unresolved" : token.startsWith("--") || token.startsWith("$") ? "syntax-variable" : "syntax-string";
          output += `<span class="${className}">${escapeHTML(token)}</span>`;
          cursor = match.index + token.length;
        }
        return output + highlightAtoms(text.slice(cursor));
      }

      function highlightDockerfileLine(line) {
        if (/^\s*#/.test(line)) return `<span class="syntax-comment">${escapeHTML(line)}</span>`;
        const instruction = line.match(/^(\s*)([A-Za-z][A-Za-z0-9_-]*)(\s+|$)(.*)$/);
        if (!instruction) return highlightDockerArguments(line);
        const instructions = new Set(["ADD", "ARG", "CMD", "COPY", "ENTRYPOINT", "ENV", "EXPOSE", "FROM", "HEALTHCHECK", "LABEL", "MAINTAINER", "ONBUILD", "RUN", "SHELL", "STOPSIGNAL", "USER", "VOLUME", "WORKDIR"]);
        if (!instructions.has(instruction[2].toUpperCase())) return highlightDockerArguments(line);
        return `${escapeHTML(instruction[1])}<span class="syntax-keyword">${escapeHTML(instruction[2])}</span>${escapeHTML(instruction[3])}${highlightDockerArguments(instruction[4])}`;
      }

      function highlightCodeLine(line, language) {
        if (language === "yaml") return highlightYamlLine(line);
        if (language === "json") return highlightAtoms(line, "json");
        if (language === "dockerfile") return highlightDockerfileLine(line);
        return highlightAtoms(line);
      }

      function renderCodePreview(content, name = "") {
        const lines = String(content).split("\n");
        const language = previewLanguage(name);
        return `<pre class="code-preview"><code>${lines.map((line, index) => {
          const safe = line ? highlightCodeLine(line, language) : " ";
          return `<span class="code-line"><span class="line-number">${index + 1}</span><span class="line-content">${safe}</span></span>`;
        }).join("")}</code></pre>`;
      }

      function flattenOutputFiles(nodes, result = []) {
        for (const node of nodes || []) {
          if (node.type === "file") result.push(node);
          else flattenOutputFiles(node.children, result);
        }
        return result;
      }

      function findOutputFile(path) {
        return flattenOutputFiles(state.rendered?.tree || []).find(file => file.path === path) || null;
      }

      function ensureOutputSelection() {
        const files = flattenOutputFiles(state.rendered?.tree || []);
        if (!files.some(file => file.path === state.selectedOutputPath)) state.selectedOutputPath = files[0]?.path || null;
      }

      function fileLanguage(name) {
        if (previewLanguage(name) === "dockerfile") return "Dockerfile";
        const extension = String(name).split(".").pop()?.toLowerCase();
        const labels = { yaml: "YAML", yml: "YAML", json: "JSON", js: "JavaScript", ts: "TypeScript", html: "HTML", css: "CSS", md: "Markdown", sh: "Shell", py: "Python", txt: "Plain text" };
        return labels[extension] || (extension ? extension.toUpperCase() : "Plain text");
      }

      function normalizeValuesPayload(input) {
        if (!input || typeof input !== "object" || Array.isArray(input)) return { globals: {}, collections: {} };
        const primitive = value => ["string", "number", "boolean"].includes(typeof value) || value == null;
        const globals = Object.fromEntries(Object.entries(input.globals || {}).filter(([key, value]) => /^[A-Za-z_][\w.-]*$/.test(key) && primitive(value)));
        const collections = Object.fromEntries(Object.entries(input.collections || {}).filter(([key, value]) => /^[A-Za-z_][\w.-]*$/.test(key) && Array.isArray(value)).map(([key, rows]) => [key, rows.map(row => {
          if (!row || typeof row !== "object" || Array.isArray(row)) return { __id: uid() };
          const entries = Object.entries(row).filter(([field, value]) => field === "__id" || (/^[A-Za-z_][\w.-]*$/.test(field) && primitive(value)));
          const item = Object.fromEntries(entries);
          item.__id = typeof item.__id === "string" && item.__id ? item.__id : uid();
          return item;
        })]));
        return { globals, collections };
      }

      function snapshotFormValues() {
        const globals = Object.fromEntries([...state.analysis.globals.values()].map(field => [field.key, state.values.globals[field.key]]));
        const collections = Object.fromEntries([...state.analysis.collections.values()].map(collection => [collection.key, (state.values.collections[collection.key] || []).map(item => Object.fromEntries([
          ["__id", item.__id || uid()],
          ...[...collection.fields.values()].map(field => [field.key, item[field.key]])
        ]))]));
        return normalizeValuesPayload({ globals, collections });
      }

      function loadConfiguration(config, mode = "fill", values = null) {
        state.config = validateAndNormalizeConfig(config);
        state.mode = ["configure", "fill", "viewer"].includes(mode) ? mode : "fill";
        state.selectedNodeId = null;
        state.selectedOutputPath = null;
        state.values = normalizeValuesPayload(values);
        state.collapsed.clear();
        state.outputCollapsed.clear();
        state.dirty = false;
        recompute();
        ensureOutputSelection();
        scheduleLocalSave();
      }

      function showDialog(id, selector = "input, select, textarea, button.primary") {
        nextTick(() => {
          const dialog = document.getElementById(id);
          if (!dialog) return;
          if (!dialog.open) dialog.showModal();
          dialog.querySelector(selector)?.focus();
        });
      }

      function closeDialog(id) {
        document.getElementById(id)?.close();
      }

      function openCreateDialog(kind, placement = "sibling") {
        const container = findContainerForSelection(placement);
        state.pendingCreateParentId = container.parentId;
        Object.assign(ui.create, {
          kind,
          parentLabel: container.label,
          computeType: "group",
          name: "",
          content: "",
          collection: "items",
          binding: "item",
          reference: "enabled",
          label: "group"
        });
        showDialog("createDialog");
      }

      function createItemFromDialog() {
        const draft = ui.create;
        let node;
        if (draft.kind === "file") {
          node = { id: uid(), type: "file", name: draft.name.trim(), content: draft.content };
        } else if (draft.kind === "folder") {
          node = { id: uid(), type: "folder", name: draft.name.trim(), children: [] };
        } else {
          const names = {
            for: "(for " + draft.binding.trim() + " in " + draft.collection.trim() + ")",
            when: "(when " + draft.reference.trim() + ")",
            "when-not": "(when not " + draft.reference.trim() + ")",
            group: "(group " + draft.label.trim() + ")"
          };
          node = { id: uid(), type: "folder", name: names[draft.computeType] || names.group, children: [] };
        }
        if (!node.name) return toast("A name is required.", "error"), false;
        if (draft.kind === "compute" && !parseCompute(node.name)) {
          toast("Use a valid binding, condition, or comparison such as mode=advanced.", "error");
          return false;
        }
        const parent = state.pendingCreateParentId ? findNode(state.pendingCreateParentId)?.node : null;
        (parent?.type === "folder" ? parent.children : state.config.tree).push(node);
        state.selectedNodeId = node.id;
        recompute();
        setDirty();
        closeDialog("createDialog");
        return true;
      }

      function selectNode(id) {
        state.selectedNodeId = id;
      }

      function toggleNode(id) {
        state.collapsed.has(id) ? state.collapsed.delete(id) : state.collapsed.add(id);
      }

      function renameSelected(value) {
        const found = selectedInfo();
        if (!found || state.mode === "viewer") return;
        found.node.name = value;
        recompute();
        setDirty();
      }

      function updateFileContent(value) {
        const found = selectedInfo();
        if (!found || found.node.type !== "file" || state.mode === "viewer") return;
        found.node.content = value;
        recompute();
        setDirty();
      }

      function requestDeleteSelected() {
        const found = selectedInfo();
        if (!found) return;
        state.pendingDeleteId = found.node.id;
        openConfirmation(
          "delete-node",
          "Delete “" + found.node.name + "”?",
          found.node.type === "folder" ? "Everything inside this folder will also be removed." : "This file will be removed from the template.",
          "Delete",
          true
        );
      }

      function removeSelectedNode() {
        const found = findNode(state.pendingDeleteId);
        if (!found) return;
        const container = found.parent ? found.parent.children : state.config.tree;
        const index = container.findIndex(node => node.id === found.node.id);
        if (index >= 0) container.splice(index, 1);
        state.selectedNodeId = found.parent?.id || null;
        state.pendingDeleteId = null;
        recompute();
        setDirty();
        toast("Item deleted.", "success");
      }

      function cloneNode(node) {
        const clone = deepClone(node);
        walkNodes([clone], child => { child.id = uid(); });
        clone.name = clone.type === "file" ? clone.name.replace(/(\.[^.]*)?$/, " copy$1") : clone.name + " copy";
        return clone;
      }

      function duplicateSelected() {
        const found = selectedInfo();
        if (!found) return;
        const container = found.parent ? found.parent.children : state.config.tree;
        const index = container.findIndex(node => node.id === found.node.id);
        const clone = cloneNode(found.node);
        container.splice(index + 1, 0, clone);
        state.selectedNodeId = clone.id;
        recompute();
        setDirty();
      }

      function moveSelected(delta) {
        const found = selectedInfo();
        if (!found) return;
        const container = found.parent ? found.parent.children : state.config.tree;
        const index = container.findIndex(node => node.id === found.node.id);
        const target = index + delta;
        if (index < 0 || target < 0 || target >= container.length) return;
        [container[index], container[target]] = [container[target], container[index]];
        setDirty();
      }

      function selectOutput(path) {
        if (findOutputFile(path)) state.selectedOutputPath = path;
        else toggleOutput(path);
