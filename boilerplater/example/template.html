<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Redirecting…</title>
  <style>
    :root {
      color-scheme: light;
      --background: #fafafa;
      --foreground: #18181b;
      --card: #ffffff;
      --muted: #f4f4f5;
      --muted-foreground: #71717a;
      --border: #e4e4e7;
      --primary: #18181b;
      --primary-foreground: #fafafa;
      --ring: #a1a1aa;
      --danger: #dc2626;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.04), 0 18px 48px rgb(0 0 0 / 0.08);
      --redirect-duration: 900ms;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --background: #09090b;
      --foreground: #fafafa;
      --card: #111113;
      --muted: #202023;
      --muted-foreground: #a1a1aa;
      --border: #2e2e32;
      --primary: #fafafa;
      --primary-foreground: #18181b;
      --ring: #71717a;
      --danger: #f87171;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 22px 60px rgb(0 0 0 / 0.3);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 12%, color-mix(in srgb, var(--foreground) 4%, transparent), transparent 34%),
        var(--background);
      color: var(--foreground);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, a { font: inherit; }

    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: color-mix(in srgb, var(--card) 92%, transparent);
      color: var(--foreground);
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.04);
      cursor: pointer;
    }

    .theme-toggle:hover { background: var(--muted); }
    .theme-toggle svg { width: 16px; height: 16px; }

    .theme-toggle:focus-visible,
    .button:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
    }

    .card {
      width: min(420px, 100%);
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .icon {
      width: 42px;
      height: 42px;
      margin-bottom: 18px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--muted);
    }

    .icon svg { width: 19px; height: 19px; }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--muted-foreground);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: -0.035em;
    }

    .destination {
      min-height: 20px;
      margin: 8px 0 0;
      color: var(--muted-foreground);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .progress {
      height: 4px;
      margin: 22px 0 16px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--muted);
    }

    .progress-bar {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: var(--primary);
      transform-origin: left;
      animation: redirect-progress var(--redirect-duration) linear both;
    }

    .button {
      width: 100%;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--primary);
      border-radius: 9px;
      background: var(--primary);
      color: var(--primary-foreground);
      font-size: 12px;
      font-weight: 620;
      text-decoration: none;
    }

    .button:hover { opacity: 0.9; }
    .button svg { width: 15px; height: 15px; }

    .card.error .icon { color: var(--danger); }
    .card.error .eyebrow { color: var(--danger); }
    .card.error .progress, .card.error .button { display: none; }

    @keyframes redirect-progress {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    @media (max-width: 480px) {
      body { padding: 16px; }
      .card { padding: 21px; }
      .theme-toggle { top: 12px; right: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .progress-bar { animation: none; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Theme: system" title="Theme: system"></button>

  <main class="card" id="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M5 12h14M14 7l5 5-5 5"/>
      </svg>
    </div>
    <p class="eyebrow" id="eyebrow">Redirecting</p>
    <h1 id="title">Taking you there…</h1>
    <p class="destination" id="destination" role="status" aria-live="polite">Preparing your destination</p>
    <div class="progress" aria-hidden="true"><span class="progress-bar"></span></div>
    <a class="button" id="continueLink" href="#">
      Continue now
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M5 12h14M14 7l5 5-5 5"/>
      </svg>
    </a>
  </main>

    const REDIRECT_DELAY_MS = 900;
    const THEME_KEY = "redirect-page-theme";
    const THEME_ORDER = ["system", "light", "dark"];
    const media = window.matchMedia("(prefers-color-scheme: dark)");
    const themeToggle = document.getElementById("themeToggle");
    let themeSetting;

    const themeIcons = {
      system: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
      light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>',
      dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg>'
    };

    function currentThemeSetting() {
      try {
        const saved = localStorage.getItem(THEME_KEY);
        return THEME_ORDER.includes(saved) ? saved : "system";
      } catch {
        return "system";
      }
    }

    function saveThemeSetting(setting) {
      try {
        localStorage.setItem(THEME_KEY, setting);
      } catch {
        // Theme persistence is optional; redirecting still works without it.
      }
    }

    function applyTheme(setting) {
      const resolved = setting === "system" ? (media.matches ? "dark" : "light") : setting;
      document.documentElement.dataset.theme = resolved;
      themeToggle.innerHTML = themeIcons[setting];
      themeToggle.setAttribute("aria-label", `Theme: ${setting}`);
      themeToggle.title = `Theme: ${setting}`;
    }

    themeToggle.addEventListener("click", () => {
      themeSetting = THEME_ORDER[(THEME_ORDER.indexOf(themeSetting) + 1) % THEME_ORDER.length];
      saveThemeSetting(themeSetting);
      applyTheme(themeSetting);
    });

    media.addEventListener?.("change", () => {
      if (themeSetting === "system") applyTheme("system");
    });

    themeSetting = currentThemeSetting();
    applyTheme(themeSetting);
    document.documentElement.style.setProperty("--redirect-duration", `${REDIRECT_DELAY_MS}ms`);

    try {
      const destination = new URL(REDIRECT_URL);
      if (!/^https?:$/.test(destination.protocol)) throw new Error("Only HTTP and HTTPS URLs are supported.");

      document.getElementById("destination").textContent = destination.hostname;
      document.getElementById("continueLink").href = destination.href;
      document.title = `Redirecting to ${destination.hostname}…`;

      window.setTimeout(() => window.location.replace(destination.href), REDIRECT_DELAY_MS);
    } catch (error) {
      document.getElementById("card").classList.add("error");
      document.getElementById("eyebrow").textContent = "Redirect unavailable";
      document.getElementById("title").textContent = "Set a valid destination URL";
      document.getElementById("destination").textContent = error.message;
      document.title = "Redirect unavailable";
    }
  </script>
